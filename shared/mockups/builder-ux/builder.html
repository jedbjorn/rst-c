<!doctype html>
<!--
  F18 Builder UX Redesign — interactive mockup v2 (Planner-02, 2026-10-30).
  Throwaway design artifact, not product code. Colours: src/RST.Core/Theming/UiPalette.cs.
  Icons: a copy of part of src/RST.Engine/Assets/icons/pack. Option state lives in the URL hash so
  a redline can name the exact variant (e.g. #pane=B&layout=tiles&actions=pane&theme=dark).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>RST — Profile Builder (F18 mockup v2)</title>
<style>
:root, .light {
  --win:#F4F5F7; --surf:#FFFFFF; --alt:#F9FAFB; --border:#D3D7DE; --strong:#6B7380; --div:#E6E8EC;
  --text:#1F2328; --muted:#5E6672; --accent:#2F6AD0; --accentHover:#2559B4; --accentSoft:#E8F0FD; --accentFg:#2F6AD0;
  --danger:#B3261E; --dangerFg:#B3261E; --hover:#EEF0F3; --pressed:#E2E5EA; --success:#187534; --successSoft:#EAF6EE;
  --warnSoft:#FFF5E0; --warnBorder:#E9C27A; --warnText:#8A5A00; --infoSoft:#EAF1FC; --infoBorder:#A9C3EC;
  --scrim:rgba(0,0,0,.35); --ribbon:#E9EBEE; --ribbonBar:#F7F8FA;
}
.dark {
  --win:#1F2329; --surf:#2A2F37; --alt:#252A31; --border:#525B67; --strong:#8C96A3; --div:#3A414B;
  --text:#E6E9ED; --muted:#AEB6C1; --accent:#2F6AD0; --accentHover:#2559B4; --accentSoft:#213454; --accentFg:#79AEFF;
  --danger:#B3261E; --dangerFg:#FF9C94; --hover:#353B44; --pressed:#3E454F; --success:#5FC27E; --successSoft:#1F3327;
  --warnSoft:#3A3123; --warnBorder:#806633; --warnText:#EDB95A; --infoSoft:#1E2D44; --infoBorder:#3E5C88;
  --scrim:rgba(0,0,0,.55); --ribbon:#30353D; --ribbonBar:#3A4048;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { font:12px "Segoe UI", system-ui, sans-serif; background:var(--win); color:var(--text); display:flex; flex-direction:column; }
button { font:inherit; color:var(--text); background:var(--surf); border:1px solid var(--border); border-radius:3px; padding:4px 12px; min-height:28px; cursor:pointer; }
button:hover { background:var(--hover); } button:active { background:var(--pressed); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.primary:hover { background:var(--accentHover); }
button:disabled { opacity:.45; cursor:default; }
button.ghost { border-color:transparent; background:transparent; padding:2px 6px; min-height:22px; }
button.ghost:hover { background:var(--hover); border-color:var(--border); }
button.danger, button.x { color:var(--dangerFg); }
input[type=text] { font:inherit; color:var(--text); background:var(--surf); border:1px solid var(--border); border-radius:3px; padding:4px 7px; min-height:26px; }
input[type=text]:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.muted { color:var(--muted); } .small { font-size:11px; } .tiny { font-size:10px; }
.section-title { font-weight:600; font-size:13px; }
.pill { display:inline-block; border:1px solid var(--border); border-radius:10px; padding:0 7px; font-size:11px; color:var(--muted); background:var(--surf); }
.label { color:var(--muted); margin:0 0 4px; display:block; }
.spacer { flex:1; }

/* Mockup strip (not part of the design) */
#mock { background:repeating-linear-gradient(45deg,#3b2a5c,#3b2a5c 10px,#43316a 10px,#43316a 20px); color:#fff; padding:5px 12px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; font-size:11px; }
#mock .seg { display:inline-flex; border:1px solid rgba(255,255,255,.5); border-radius:4px; overflow:hidden; }
#mock .seg button { background:transparent; color:#fff; border:0; border-radius:0; min-height:22px; padding:2px 9px; font-size:11px; }
#mock .seg button.on { background:#fff; color:#3b2a5c; font-weight:600; }
#mock .grp { display:flex; align-items:center; gap:6px; }

/* Window */
#app { flex:1; display:flex; flex-direction:column; min-height:0; }
header.top { height:54px; background:var(--hdr, var(--alt)); border-bottom:1px solid var(--hdrLine, var(--border)); display:flex; align-items:center; padding:0 16px; gap:10px; flex:none; }
.gear { width:30px; min-width:30px; padding:0; font-size:16px; line-height:1; }
/* Header colour options: existing palette entries only (UiPalette AccentSoft / Pressed / SurfaceAlt). */
.hdr-tint { --hdr:var(--accentSoft); --hdrLine:var(--infoBorder); }
.hdr-neutral { --hdr:var(--pressed); --hdrLine:var(--strong); }
.vsep { width:1px; height:20px; background:var(--div); margin:0 6px; }
.dirty { color:var(--warnText); font-size:11px; display:flex; align-items:center; gap:5px; }
.dirty::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--warnText); }
.profile-btn { width:250px; display:flex; justify-content:space-between; align-items:center; text-align:left; }
.menu { position:absolute; z-index:40; background:var(--surf); border:1px solid var(--strong); border-radius:5px; box-shadow:0 6px 18px rgba(0,0,0,.25); padding:4px; min-width:250px; }
.menu .mi { padding:6px 10px; border-radius:3px; cursor:pointer; display:flex; justify-content:space-between; gap:12px; }
.menu .mi:hover { background:var(--hover); }
.menu .mi.cur { font-weight:600; }
.menu .hd { padding:6px 10px 2px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
.menu hr { border:0; border-top:1px solid var(--div); margin:4px 0; }

main { flex:1; display:grid; grid-template-columns:320px 1fr 330px; min-height:0; }
.pane { display:flex; flex-direction:column; min-height:0; }
.pane-head { height:42px; border-bottom:1px solid var(--border); padding:0 14px; display:flex; align-items:center; gap:8px; flex:none; }
.scroll { overflow:auto; flex:1; min-height:0; }

/* Commands */
#left { background:var(--alt); border-right:1px solid var(--border); }
.filter-row { display:flex; gap:6px; padding:10px 12px 8px; }
.filter-row input { flex:1; min-width:0; }
.filter-row button { white-space:nowrap; }
.tree { padding:0 8px 10px; }
.node { display:flex; align-items:center; gap:5px; padding:3px 4px; border-radius:3px; user-select:none; min-height:24px; }
.node:hover { background:var(--hover); }
.node .tw { width:14px; color:var(--muted); font-size:9px; text-align:center; cursor:pointer; }
.node .lbl { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.node.grp { cursor:pointer; } .node.grp .lbl { font-weight:600; } .node.grp.sub .lbl { font-weight:400; }
.node .sid { color:var(--muted); font-size:10px; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.node.cmd { cursor:grab; }
.node .acts { display:none; gap:2px; } .node:hover .acts { display:flex; }
.node .acts button { min-height:20px; padding:0 6px; font-size:11px; }
.custom-group { margin:2px 0 8px; border:1px solid var(--infoBorder); background:var(--infoSoft); border-radius:5px; padding:2px 2px 4px; }
.custom-group .note { padding:2px 8px 4px 24px; }
.kind { font-size:9px; border:1px solid var(--border); border-radius:3px; padding:0 4px; color:var(--muted); text-transform:uppercase; }
.ico16 { width:16px; height:16px; flex:none; }
.ico16.blank { display:inline-block; border:1px dashed var(--border); border-radius:2px; }

/* Canvas */
#center { background:var(--win); }
.tabchip { border:1px solid var(--accent); color:var(--accentFg); border-radius:3px; padding:2px 10px; background:var(--accentSoft); cursor:pointer; }
#canvas { padding:16px 20px 30px; min-height:100%; }
.card { background:var(--surf); border:1px solid var(--border); border-radius:6px; margin-bottom:14px; position:relative; }
.card.sel { box-shadow:0 0 0 2px var(--accentFg); border-color:transparent; }
.card .stripe { height:4px; border-radius:5px 5px 0 0; }
.card-head { display:flex; align-items:center; gap:8px; padding:7px 10px; background:var(--alt); border-bottom:1px solid var(--div); }
.handle { cursor:grab; color:var(--muted); padding:0 2px; font-size:13px; user-select:none; }
.swatch { width:22px; height:22px; border-radius:4px; border:1px solid rgba(0,0,0,.25); cursor:pointer; flex:none; }
.pname { font-weight:600; font-size:13px; width:220px; border-color:transparent !important; background:transparent !important; box-shadow:none !important; }
.pname:hover { border-color:var(--border) !important; } .pname:focus { background:var(--surf) !important; border-color:var(--accent) !important; }
.hover-acts { display:flex; gap:2px; opacity:0; transition:opacity .1s; }
.card:hover .hover-acts, .card.sel .hover-acts { opacity:1; }
.card-body { padding:10px 12px; min-height:56px; }
.card-body.rows { display:flex; flex-direction:column; gap:6px; }
.card-body.tiles { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; }
.empty { color:var(--muted); text-align:center; padding:12px; border:1px dashed var(--border); border-radius:4px; flex:1; }

/* tool row */
.tool { position:relative; display:flex; align-items:center; gap:8px; background:var(--win); border:1px solid var(--border); border-radius:4px; padding:3px 6px; }
.tool:hover { border-color:var(--strong); }
.iconbtn { display:inline-flex; align-items:center; border:1px solid var(--border); background:var(--surf); border-radius:3px; padding:3px 4px; cursor:pointer; }
.iconbtn:hover { background:var(--hover); border-color:var(--accent); }
input.tname { flex:1; min-width:80px; border-color:transparent; background:transparent; }
input.tname:hover { border-color:var(--border); } input.tname:focus { background:var(--surf); }
.src { color:var(--muted); font-size:10px; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tacts { display:flex; gap:2px; align-items:center; }
.tool .hov, .srow .hov, .tile .hov { visibility:hidden; } .tool:hover .hov, .srow:hover .hov, .tile:hover .hov { visibility:visible; }
.x { font-size:14px; line-height:1; }
.badge-custom { font-size:9px; color:var(--accentFg); border:1px solid var(--infoBorder); background:var(--infoSoft); border-radius:3px; padding:0 4px; text-transform:uppercase; }

/* stack (rows) */
.stack { position:relative; border:1px solid var(--strong); border-left:4px solid var(--strong); border-radius:4px; background:var(--alt); padding:6px 6px 6px 6px; display:flex; gap:6px; }
.stack .members { flex:1; display:flex; flex-direction:column; gap:4px; }
.stack .stack-side { display:flex; flex-direction:column; align-items:center; gap:3px; justify-content:center; }
.stack .stack-tag { font-size:9px; color:var(--muted); writing-mode:vertical-rl; transform:rotate(180deg); letter-spacing:.5px; }
.stack .tool { background:var(--surf); }

/* tiles */
.tile { position:relative; width:100px; border:1px solid var(--border); border-radius:4px; background:var(--win); display:flex; flex-direction:column; align-items:center; padding:9px 4px 5px; gap:4px; cursor:grab; }
.tile:hover { border-color:var(--strong); }
.tile img, .blank32 { width:32px; height:32px; }
.blank32 { display:inline-block; border:1px dashed var(--border); border-radius:3px; }
.tile input.tname { width:100%; text-align:center; font-size:11px; padding:2px; min-height:20px; flex:none; min-width:0; }
.tile .src { max-width:92px; font-size:9px; }
.tile .corner { position:absolute; top:1px; right:1px; display:flex; gap:0; }
.tile .corner button, .srow button, .tstack-head button { min-height:18px; padding:0 4px; font-size:11px; }
.tstack { position:relative; border:1px solid var(--strong); border-top:3px solid var(--strong); border-radius:4px; background:var(--alt); padding:4px 6px 6px; display:flex; flex-direction:column; gap:3px; width:200px; cursor:grab; }
.tstack-head { display:flex; align-items:center; gap:4px; font-size:9px; color:var(--muted); letter-spacing:.5px; }
.srow { display:flex; align-items:center; gap:5px; background:var(--surf); border:1px solid var(--border); border-radius:3px; padding:2px 4px; cursor:grab; position:relative; }
.srow input.tname { font-size:11px; padding:1px 4px; min-height:20px; min-width:40px; }

/* drop markers */
.mk-before::before, .mk-after::after { content:""; position:absolute; background:var(--success); z-index:5; pointer-events:none; }
.v.mk-before::before { left:0; right:0; top:-4px; height:2px; } .v.mk-after::after { left:0; right:0; bottom:-4px; height:2px; }
.h.mk-before::before { top:0; bottom:0; left:-6px; width:2px; } .h.mk-after::after { top:0; bottom:0; right:-6px; width:2px; }
.mk-center { outline:2px dashed var(--success); outline-offset:1px; background:var(--successSoft) !important; }
.mk-refuse { outline:2px dashed var(--dangerFg); outline-offset:1px; }
.mk-body { background:var(--successSoft); }
.dragging { opacity:.4; }

/* Right pane */
#right { background:var(--surf); border-left:1px solid var(--border); }
.psec { padding:14px 16px; border-bottom:1px solid var(--div); }
.psec h4 { margin:0 0 8px; font-size:12px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
.field { margin-bottom:10px; } .field > input[type=text] { width:100%; }
.help { color:var(--muted); font-size:11px; margin-top:3px; }
.tabs { display:flex; border-bottom:1px solid var(--border); padding:0 10px; gap:2px; flex:none; }
.tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:transparent; padding:8px 10px; }
.tabs button.on { border-bottom-color:var(--accent); color:var(--accentFg); font-weight:600; }
.switch { position:relative; width:32px; height:18px; border-radius:9px; background:var(--strong); flex:none; cursor:pointer; border:0; padding:0; min-height:0; }
.switch::after { content:""; position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%; background:#fff; transition:left .1s; }
.switch.on { background:var(--accent); } .switch.on::after { left:17px; } .switch:hover { background:var(--strong); } .switch.on:hover { background:var(--accentHover); }
.swrow { display:flex; align-items:center; gap:10px; padding:5px 0; }
.swrow .grow { flex:1; }
.range { display:flex; align-items:center; gap:8px; } .range input { flex:1; accent-color:var(--accent); }

/* Preview */
#preview { background:var(--alt); border-top:1px solid var(--border); padding:8px 16px 12px; flex:none; }
.ribbon { background:var(--ribbon); border:1px solid var(--border); border-radius:4px; overflow-x:auto; }
.rtabs { display:flex; align-items:flex-end; gap:6px; padding:5px 8px 0; border-bottom:1px solid var(--border); background:var(--ribbonBar); }
.rtab { border:1px solid var(--border); border-bottom:0; border-radius:3px 3px 0 0; padding:2px 12px; background:var(--ribbon); font-weight:600; }
.rpanels { display:flex; gap:6px; padding:6px; align-items:stretch; }
.rpanel { border-radius:5px; display:flex; flex-direction:column; min-width:60px; }
.rpanel .ritems { display:flex; gap:4px; padding:6px 6px 3px; align-items:flex-start; flex:1; }
.rpanel .rtitle { text-align:center; font-size:10px; padding:2px 8px; border-radius:0 0 5px 5px; }
.rbig { width:54px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; text-align:center; line-height:1.15; }
.rbig img, .rbig .blank32 { width:32px; height:32px; }
.rstk { display:flex; flex-direction:column; gap:2px; font-size:10px; padding:0 4px; }
.rstk div { display:flex; align-items:center; gap:4px; white-space:nowrap; height:19px; }

/* Modal + popovers + toast */
#scrim { position:fixed; inset:0; background:var(--scrim); display:none; align-items:center; justify-content:center; z-index:60; }
.modal { background:var(--surf); border:1px solid var(--strong); border-radius:6px; width:440px; max-height:80vh; display:flex; flex-direction:column; box-shadow:0 10px 30px rgba(0,0,0,.35); }
.modal .mh { padding:14px 16px 6px; font-weight:600; font-size:14px; }
.modal .mb { padding:6px 16px 10px; overflow:auto; }
.modal .mf { padding:10px 16px; border-top:1px solid var(--div); display:flex; justify-content:flex-end; gap:8px; }
.seg2 { display:inline-flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
.seg2 button { border:0; border-radius:0; } .seg2 button.on { background:var(--accentSoft); color:var(--accentFg); font-weight:600; }
.pop { position:absolute; z-index:50; background:var(--surf); border:1px solid var(--strong); border-radius:5px; padding:10px; box-shadow:0 6px 18px rgba(0,0,0,.25); }
.icongrid { display:grid; grid-template-columns:repeat(7, 34px); gap:4px; }
.icongrid .ic { width:34px; height:34px; border:1px solid var(--border); border-radius:3px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--win); }
.icongrid .ic:hover, .icongrid .ic.on { border-color:var(--accent); background:var(--accentSoft); }
.icongrid img { width:22px; height:22px; }
.colors { display:grid; grid-template-columns:repeat(6, 24px); gap:5px; }
.colors .c { width:24px; height:24px; border-radius:4px; cursor:pointer; border:1px solid rgba(0,0,0,.2); }
.chk { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:3px; cursor:pointer; }
.chk:hover { background:var(--hover); }
.callout { border:1px solid var(--infoBorder); background:var(--infoSoft); border-radius:4px; padding:8px 10px; margin:8px 0; }
.callout.warn { border-color:var(--warnBorder); background:var(--warnSoft); color:var(--warnText); }
#toast { position:fixed; left:50%; bottom:190px; transform:translateX(-50%); background:var(--text); color:var(--surf); padding:8px 16px; border-radius:5px; display:none; z-index:70; box-shadow:0 4px 14px rgba(0,0,0,.3); }
#toast.err { background:var(--danger); color:#fff; }
</style>
</head>
<body>
<div id="mock"></div>
<div id="app">
  <header class="top" id="header"></header>
  <main>
    <section class="pane" id="left"></section>
    <section class="pane" id="center"></section>
    <section class="pane" id="right"></section>
  </main>
  <section id="preview"></section>
</div>
<div id="scrim"></div>
<div id="toast"></div>
<script>
// ───────────────────────── option state (URL hash) ─────────────────────────
// v2: the FnB's picks come first, so they are the defaults (B · Tabs, Tiles, In profile menu).
const OPTS = { pane:['B','A'], layout:['tiles','rows'], actions:['header','pane'], header:['tint','neutral','plain'], theme:['light','dark'] };
const OPT_LABELS = {
  pane:['Profile pane', { A:'A · Sections', B:'B · Tabs' }],
  layout:['Panel layout', { rows:'Rows', tiles:'Tiles (ribbon-like)' }],
  actions:['Rename / Duplicate', { header:'In profile menu', pane:'In Profile pane' }],
  header:['Header colour', { tint:'Tint (AccentSoft)', neutral:'Neutral (Pressed)', plain:'v1 (SurfaceAlt)' }],
  theme:['Theme', { light:'Light', dark:'Dark' }],
};
const opt = {};
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  for (const k in OPTS) opt[k] = OPTS[k].includes(q.get(k)) ? q.get(k) : OPTS[k][0];
}
function writeHash() { history.replaceState(null, '', '#' + new URLSearchParams(opt).toString()); }

// ───────────────────────── seed data ─────────────────────────
let _id = 0; const uid = p => (p || 'u') + (++_id);
const cmd = (name, id, tab, panel, icon) => ({ uid:uid('t'), name, base:name, type:'cmd', cmd:id, icon:icon || null, source:`${tab} · ${panel}` });
const url = (name, link, icon) => ({ uid:uid('t'), name, base:name, type:link.startsWith('mailto:') ? 'email' : 'url', link, icon:icon || null });
const stack = (...tools) => ({ sid:uid('s'), tools });
const DEFAULT_CLEANUP = () => [
  { name:'Windows Temp', on:true }, { name:'Revit package cache', on:true }, { name:'Revit journals', on:true },
  { name:'Collaboration cache', on:true }, { name:'Recent-file list', on:false }, { name:'RST logs', on:true }];
const RIBBON_TABS = ['Enscape','Kinship','pyRevit','Analyze','Collaborate','Systems','Massing & Site','Insert','Steel','Precast'];

function seedProfiles() {
  return [
    { id:'p1', name:'Structure', tab:'Studio Struct', loaded:true, minVersion:'2.1.0', opacity:60,
      presets:{ hidden:['Massing & Site','Precast'], disableUnused:true }, cleanup:DEFAULT_CLEANUP(),
      panels:[
        { pid:uid('p'), name:'Frame', color:'#e05a5a', items:[
          cmd('Beam','ID_BEAM','Structure','Structure','parallel_red'),
          cmd('Column','ID_OBJECTS_COLUMN','Structure','Structure','box_stack_dark_grey'),
          cmd('Brace','ID_BRACE','Structure','Structure','arrow_45_orange') ]},
        { pid:uid('p'), name:'Review', color:'#14b8a6', items:[
          cmd('Kinship','ID_KINSHIP','Kinship','Kinship','box_open_blue'),
          stack(cmd('Warnings','PYR_WARNINGS','pyRevit','Analysis','checklist_orange'),
                cmd('Audit','PYR_AUDIT','pyRevit','Analysis','check_green'),
                cmd('Purge','PYR_PURGE','pyRevit','Analysis','filter_red')),
          cmd('Notes','ID_TEXT_NOTE','Annotate','Text',null) ]},
        { pid:uid('p'), name:'Links', color:'#f0b44c', items:[
          url('Wiki','https://wiki.studio.example','link_external_blue'),
          url('Help','mailto:bim@studio.example','question') ]},
      ]},
    { id:'p2', name:'Architecture', tab:'Studio Arch', loaded:false, minVersion:'2.1.0', opacity:80,
      presets:{ hidden:['Steel','Precast'], disableUnused:false }, cleanup:DEFAULT_CLEANUP(),
      panels:[
        { pid:uid('p'), name:'Build', color:'#4f7fd9', items:[
          cmd('Wall','ID_OBJECTS_WALL','Architecture','Build','house_blue'),
          cmd('Door','ID_OBJECTS_DOOR','Architecture','Build','box_blue'),
          cmd('Window','ID_OBJECTS_WINDOW','Architecture','Build','plans_blue') ]},
        { pid:uid('p'), name:'Studio', color:'#8e6bd1', items:[
          url('Wiki','https://wiki.studio.example','link_external_purple'),
          url('BIM Standards','https://standards.studio.example','sheets_purple'),
          url('Help','mailto:bim@studio.example','question_purple') ]},
      ]},
