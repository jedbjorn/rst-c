name: _build (reusable)

# RST-013 — Reusable build pipeline for the multi-Revit MSI path.
# Called by build.yml (push/PR) and release.yml (v* tags). Filename is
# `_build.yml` (leading underscore) to flag "internal — don't trigger
# directly" by convention.
#
#   • test         — the Revit API floor check (decision #26:
#                    build/check-revit-api-floor.py fails on any
#                    Nice3point.Revit.Api pin above the year's earliest
#                    update), then xunit on RST.Tests (configuration-agnostic)
#   • test-runtime — matrix R25/R26/R27: xunit on RST.RuntimeTests (Windows-
#                    only WPF paths: bridge + resolver production
#                    contracts) on net8.0-windows and net10.0-windows.
#   • serilog-probe — builds the AAA/ZZZ Serilog probe add-ins (VM step V3,
#                    decision #27) and uploads the SerilogProbe artifact.
#                    Never shipped.
#   • probe        — builds the RST-Probe test add-in (feature #16 VM checks)
#                    and uploads it as the RST-Probe artifact. Never shipped.
#   • stage        — matrix R25/R26/R27, runs build/stage.sh per major,
#                    checks it ships no third-party DLL (decision #33,
#                    build/check-shipped-dlls.sh), and
#                    uploads the bundle as a per-major artifact. Every
#                    major is a hard gate: an R27 failure fails the
#                    workflow and blocks a release (feature #11, D7: no
#                    skip-R27 switch).
#                    Each staged RST binary must carry the version passed in
#                    (SC-054, build/check-version-stamp.py).
#   • stage-tray   — build/stage.sh tray: RST.Tray.exe once, not per major
#                    (feature #17), uploaded as stage-Tray.
#   • msi-unified  — Windows runner. Downloads R25 + R26 + R27 artifacts,
#                    runs installer/RST.Installer.wixproj → RST.msi (all
#                    three majors in one MSI; each installs only when that
#                    Revit year is detected), then a permanent smoke with
#                    stub Revit.exe files (installer/ci-smoke.ps1 -Mode
#                    Install): Component-table check, detected years only,
#                    no-Revit refusal, Repair adds/drops a year, uninstall.
#                    Also builds RST-Machine.msi (feature #17: the same
#                    sources, -p:RstScope=machine) and a 1.0.0 build of
#                    each for the upgrade smokes (artifact msi-test).
#   • msi-machine  — Windows runner (administrator): RST-Machine.msi
#                    installs, repairs, upgrades and uninstalls per machine
#                    and grants nothing (installer/ci-machine-smoke.ps1, AC9).
#   • msi-migrate  — Windows runner, matrix v2.2.0 Preview/Unified and
#                    v3.0.0 Unified. Installs the public v2.2.0 RST-R27.msi
#                    or RST.msi, or the v3.0.0 RST.msi, then the new
#                    RST.msi, and asserts the preview is removed / the
#                    unified product upgrades in place.
#   • bundle       — Windows runner. Downloads + sha256-verifies the pinned
#                    companion MSIs (companions/companions.json), builds
#                    installer-bundle/RST.Setup.wixproj → RST-Setup.exe
#                    (feature #13), plus the smoke's fixture test bundle.
#   • bundle-smoke — Windows runner, matrix Chain/BareMsiFirst/Companions/UI/Scope:
#                    installer-bundle/ci-bundle-smoke.ps1 (install order,
#                    bare RST.msi first, the real companions, the UI, both install scopes).
#   • release-sums — build/sha256sums.sh self-test over this build's
#                    RST.msi, RST-Machine.msi and RST-Setup.exe (feature #17, spec #20 §8).
#   • tray-detect  — Windows runner: the tray's companion detection against
#                    the fixture companion MSI, built in the job from the
#                    bundle's fixture project (installer/ci-tray-detect.ps1,
#                    feature #17 AC5).
#   • tray-install — Windows runner: the tray's verified installs against
#                    a fake GitHub serving the fixture companion MSI
#                    (installer/ci-tray-install.ps1, feature #17 AC6, AC7).
#   • tray-selfupdate — Windows runner: RST updating itself through the
#                    tray's updater copy, across three RST.msi builds of
#                    this commit (installer/ci-tray-selfupdate.ps1, AC8).
#
# WiX MSI emission is officially Windows-only (installer/README.md). The
# WiX SDK MSBuild path on Linux emits WIX0000 ("behavior is undefined")
# and trips WIX0389 on every Directory/@Name. Stage jobs stay on Linux —
# `dotnet build` of net8/net10-windows TFMs works there via
# EnableWindowsTargeting. Only the WiX step pays the Windows-runner cost.

on:
  workflow_call:
    inputs:
      product_version:
        description: >-
          Numeric MSI ProductVersion (a.b.c) to stamp into RST.msi. Empty for
          push/PR builds — the wixproj fallback applies. release.yml derives it
          from the tag so a release always raises ProductVersion (MajorUpgrade).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:

  test:
    name: Test (xunit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revit API floor (decision #26)
        run: python3 build/check-revit-api-floor.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test src/RST.Tests/RST.Tests.csproj -c Release --nologo

  # RuntimeTests invokes the real WPF assemblies (the windows, IconAssets)
  # — it can only RUN on Windows. No Revit needed, so windows-latest
  # suffices and the self-hosted Revit runner stays out of the PR gate.
  # R27 leg (feature #11, D5): the same contracts on net10.0-windows.
  # R26 leg (SC-045): the 2026 build (net8.0-windows, its own Revit API
  # pins) runs the same contracts, since Revit 2026 is a shipped year.
  test-runtime:
    name: Test (runtime, Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        major: [R25, R26, R27]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-dotnet@v4
        if: matrix.major == 'R27'
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test src/RST.RuntimeTests/RST.RuntimeTests.csproj -c "Release ${{ matrix.major }}" --nologo
      # Spec #16 screenshot pipeline: the runtime tests write PNGs (and a
      # capture-environment .txt) under TestResults/screenshots. Uploaded even
      # when a test fails, so a broken render can be looked at. One upload per
      # run: this job is a per-major matrix (feature #11) and only the R25
      # leg uploads, so the fixed artifact name never collides.
      - name: List screenshots
        if: always() && matrix.major == 'R25'
        shell: bash
        run: find TestResults/screenshots -type f -exec ls -l {} + || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.major == 'R25'
        with:
          name: RST-screenshots
          path: |
            TestResults/screenshots/*.png
            TestResults/screenshots/*.txt
          if-no-files-found: error

  # Feature #16 (spec #18, AC5): RST-Probe, the test add-in the VM checks stage
  # (tests/fixtures/RstProbe: per-user and bundle variants, 2026 net8 and 2027
  # net10, plus the guest helper rst-probe.ps1). Never shipped: release.yml
  # takes RST.msi only.
  probe:
    name: RST-Probe (test add-in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build tests/fixtures/RstProbe/RstProbe.csproj -c "Release R26" --nologo
      - run: dotnet build tests/fixtures/RstProbe/RstProbe.csproj -c "Release R27" --nologo
      - run: bash tests/fixtures/RstProbe/package.sh out/RST-Probe
      - uses: actions/upload-artifact@v4
        with:
          name: RST-Probe
          path: out/RST-Probe/
          if-no-files-found: error

  # Decision #27 (research V3): the two Serilog probe add-ins the VM run
  # installs beside RST (tests/fixtures/SerilogProbe: AAA ships Serilog 3.1.1
  # and its own resolver, ZZZ ships Serilog 4.2.0; 2026 net8 and 2027 net10,
  # plus the guest helper serilog-probe.ps1). Never shipped: release.yml
  # takes RST.msi only.
  serilog-probe:
    name: SerilogProbe (test add-ins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build AAA and ZZZ for R26 and R27
        run: |
          for p in AAA ZZZ; do
            for c in "Release R26" "Release R27"; do
              dotnet build "tests/fixtures/SerilogProbe/$p/$p-SerilogProbe.csproj" -c "$c" --nologo
            done
          done
      - run: bash tests/fixtures/SerilogProbe/package.sh out/SerilogProbe
      - uses: actions/upload-artifact@v4
        with:
          name: SerilogProbe
          path: out/SerilogProbe/
          if-no-files-found: error

  stage:
    name: Stage ${{ matrix.major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: R25
          - major: R26
          - major: R27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # SDK 10 is GA (10.0.203 as of 2026-05-10); install alongside SDK 8
      # only when building R27 to keep R25/R26 jobs lean.
      - uses: actions/setup-dotnet@v4
        if: matrix.major == 'R27'
        with:
          dotnet-version: '10.0.x'
      # SC-054: the release's a.b.c stamps every RST assembly (FileVersion,
      # InformationalVersion); 3.2.99-dev (RstDevVersion) on push/PR. stage.sh checks
      # the staged binaries carry it (build/check-version-stamp.py).
      - run: build/stage.sh ${{ matrix.major }} Release
        env:
          RST_VERSION: ${{ inputs.product_version }}
      # Decision #33: Revit's shared load context gets no third-party DLL
      # from RST. Fails on any DLL that is not RST.* and not named in
      # build/third-party-allowlist.txt (empty).
      - name: No third-party DLLs (decision #33)
        run: build/check-shipped-dlls.sh build/${{ matrix.major }}
      - uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.major }}
          path: build/${{ matrix.major }}/
          if-no-files-found: error

  # RST tray (feature #17, spec #20 §1): RST.Tray.exe is built once, not per
  # Revit year (net8.0-windows, RollForward=Major), by build/stage.sh tray
  # into build/Tray/. RST.msi's Main feature installs it; the version stamp
  # is the release's a.b.c (3.2.99-dev, RstDevVersion, on push/PR builds).
  stage-tray:
    name: Stage Tray
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: build/stage.sh tray Release
        env:
          RST_VERSION: ${{ inputs.product_version }}
      # The tray is not in Revit, but logs through the same in-house logger
      # and ships no third-party DLL either (decision #33).
      - name: No third-party DLLs (decision #33)
        run: build/check-shipped-dlls.sh build/Tray
      - uses: actions/upload-artifact@v4
        with:
          name: stage-Tray
          path: build/Tray/
          if-no-files-found: error

  msi-unified:
    name: MSI (R25 + R26 + R27)
    needs: [stage, stage-tray]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # SDK 8 only: the MSI carries files, so the R27 net10 payload needs
      # no .NET 10 here.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: stage-R25
          path: build/R25/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R26
          path: build/R26/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R27
          path: build/R27/
      - uses: actions/download-artifact@v4
        with:
          name: stage-Tray
          path: build/Tray/
      - run: dotnet build installer/RST.Installer.wixproj -c Release --nologo -p:RstMsiVersion=${{ inputs.product_version }}
      # Rebuild the same commit: same ProductVersion, new ProductCode. That
      # is the rc -> final case (release.yml strips -rc.N) the smoke below
      # checks against AllowSameVersionUpgrades. The rebuilt RST.msi is the
      # one uploaded.
      - name: Same-version rebuild
        shell: pwsh
        run: |
          Copy-Item installer/bin/Release/RST.msi "$env:RUNNER_TEMP/RST-first.msi"
          dotnet build installer/RST.Installer.wixproj -c Release --nologo --no-restore -t:Rebuild -p:RstMsiVersion=${{ inputs.product_version }}
      # RST tray (feature #17, review N3): the same commit built at a lower
      # ProductVersion (1.0.0), for the smoke's MajorUpgrade-with-a-running-
      # tray step (u). The release RST.msi is set aside and put back, so the
      # uploaded artifact is the one built above.
      - name: Older-version build (tray upgrade step)
        shell: pwsh
        run: |
          Copy-Item installer/bin/Release/RST.msi "$env:RUNNER_TEMP/RST-final.msi"
          dotnet build installer/RST.Installer.wixproj -c Release --nologo --no-restore -t:Rebuild -p:RstMsiVersion=1.0.0
          Copy-Item installer/bin/Release/RST.msi "$env:RUNNER_TEMP/RST-older.msi"
          Copy-Item "$env:RUNNER_TEMP/RST-final.msi" installer/bin/Release/RST.msi -Force
      # RST-Machine.msi (feature #17, spec #20 §7): the same sources built per
      # machine (RstScope=machine, its own obj\machine\ and UpgradeCode), at
      # this build's version, plus the same commit at 1.0.0 for msi-machine's
      # upgrade step. The release one is set aside and put back, as above.
      - name: RST-Machine.msi (per machine) and its older build
        shell: pwsh
        run: |
          dotnet build installer/RST.Installer.wixproj -c Release --nologo -p:RstScope=machine -p:RstMsiVersion=1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer/bin/Release/RST-Machine.msi "$env:RUNNER_TEMP/RST-Machine-older.msi"
          dotnet build installer/RST.Installer.wixproj -c Release --nologo --no-restore -t:Rebuild -p:RstScope=machine -p:RstMsiVersion=${{ inputs.product_version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force msi-test | Out-Null
          Copy-Item "$env:RUNNER_TEMP/RST-older.msi", "$env:RUNNER_TEMP/RST-Machine-older.msi" msi-test/
          Get-ChildItem installer/bin/Release/*.msi, msi-test | Format-Table Name, Length
      # Permanent install/uninstall smoke (feature #11, D6 / AC3, decision
      # #10). Stub Revit.exe files under C:\Program Files\Autodesk\Revit
      # <year>\ drive the detection: no Revit is refused, only detected
      # years install, Repair adds/drops a year, a same-version build and a
      # repeated install leave one product, uninstall removes every tree,
      # user data survives. -StagedRoot checks per-year component counts.
      - name: Install / uninstall smoke
        shell: pwsh
        run: installer/ci-smoke.ps1 -Mode Install -Msi "$env:RUNNER_TEMP/RST-first.msi" -SameVersionMsi installer/bin/Release/RST.msi -StagedRoot build -OlderMsi "$env:RUNNER_TEMP/RST-older.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: RST.msi
          path: installer/bin/Release/RST.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RST-Machine.msi
          path: installer/bin/Release/RST-Machine.msi
          if-no-files-found: error
      # Test-only builds (never released): this commit at 1.0.0, per user and
      # per machine, for the upgrade and "remove the user's copy" smokes.
      - uses: actions/upload-artifact@v4
        with:
          name: msi-test
          path: msi-test/
          if-no-files-found: error

  # RST-Machine.msi (feature #17, spec #20 §7, AC9) on an administrator
  # runner (GitHub's Windows runners run as an administrator):
  # installer/ci-machine-smoke.ps1. Identity and component checks (no
  # ComponentId shared with RST.msi), "grants nothing" (no service,
  # permission, user or group table, only WiX's own custom actions; folder
  # and Run-key ACLs compared before and after install, repair and
  # uninstall; everything created only inherits; no service or scheduled
  # task added), the per-user-copy refusal, detected years only, Repair adds
  # a year, the installer starts exactly one tray for the administrator and
  # never an elevated one (SC-044), none when it runs as SYSTEM, an upgrade
  # from a 1.0.0 build of this commit with a tray running (closed by WM_CLOSE,
  # never restarted elevated), and a clean uninstall.
  msi-machine:
    name: MSI per machine (RST-Machine.msi)
    needs: msi-unified
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RST-Machine.msi
          path: new/
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: new/
      - uses: actions/download-artifact@v4
        with:
          name: msi-test
          path: msi-test/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R25
          path: build/R25/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R26
          path: build/R26/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R27
          path: build/R27/
      - uses: actions/download-artifact@v4
        with:
          name: stage-Tray
          path: build/Tray/
      - name: Per-machine install smoke
        shell: pwsh
        run: installer/ci-machine-smoke.ps1 -Msi new/RST-Machine.msi -UserMsi new/RST.msi -OlderMsi msi-test/RST-Machine-older.msi -StagedRoot build
      - name: Upload msiexec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-machine-logs
          path: ${{ runner.temp }}/machine-*.log
          if-no-files-found: ignore

  # Upgrade paths from released MSIs (feature #11, AC4/AC5).
  # v2.2.0 is pinned: it is the final release that shipped RST-R27.msi.
  # v3.0.0 is the first unified release: the PR build (RstDevVersion 3.2.99; was
  # 3.0.99, flag SC-004) must upgrade it in place. It is also the last tray-less
  # release, so the Migrate smoke's tray checks prove the first tray-carrying
  # RST.msi over it (feature #17, review N3).
  # v3.2.0 is the latest release. Since v3.1.1 a release's tray files carry its
  # FileVersion (v3.2.0's are 3.2.0.0): an untagged build's files must not be
  # older, or Windows Installer skips them and the MajorUpgrade removes the old
  # ones, leaving no tray. -TrayStaged checks every staged tray file is
  # installed after the upgrade, byte for byte. Move this leg to the newest
  # release after each one (installer/README.md, "Untagged builds").
  msi-migrate:
    name: MSI upgrade from ${{ matrix.release }} (${{ matrix.from }})
    needs: msi-unified
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: v2.2.0
            from: Preview
            asset: RST-R27.msi
          - release: v2.2.0
            from: Unified
            asset: RST.msi
          - release: v3.0.0
            from: Unified
            asset: RST.msi
          - release: v3.2.0
            from: Unified
            asset: RST.msi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: new/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R27
          path: build/R27/
      - uses: actions/download-artifact@v4
        with:
          name: stage-Tray
          path: build/Tray/
      - name: Download ${{ matrix.release }} ${{ matrix.asset }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ matrix.release }} -R "${{ github.repository }}" -p "${{ matrix.asset }}" -D old
      - name: Upgrade from ${{ matrix.release }} ${{ matrix.asset }}
        shell: pwsh
        run: installer/ci-smoke.ps1 -Mode Migrate -From ${{ matrix.from }} -Msi new/RST.msi -OldMsi "old/${{ matrix.asset }}" -StagedR27 build/R27 -TrayStaged build/Tray

  # Setup bundle (feature #13 Phase 2, spec #15, AC3). Downloads each
  # shippable companion's pinned release asset and fails on a missing asset
  # or a sha256 / UpgradeCode / version mismatch; then builds RST-Setup.exe
  # (RST.msi + the shippable companions, from companions/companions.json),
  # a zero-shippable variant, the fixture companion and the smoke's test
  # bundle, and checks by /layout that each embeds exactly what it should.
  bundle:
    name: Bundle (RST-Setup.exe)
    needs: msi-unified
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: installer/bin/Release/
      - uses: actions/download-artifact@v4
        with:
          name: RST-Machine.msi
          path: installer/bin/Release/
      - name: Download and verify companion pins
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: installer-bundle/fetch-companions.ps1
      - name: Build bundles and check what they embed
        shell: pwsh
        run: installer-bundle/ci-bundle-build.ps1 -Version "${{ inputs.product_version }}" -RstMsi installer/bin/Release/RST.msi -RstMachineMsi installer/bin/Release/RST-Machine.msi
      - uses: actions/upload-artifact@v4
        with:
          name: RST-Setup.exe
          path: installer-bundle/bin/Release/RST-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-test
          path: installer-bundle/bin/ci/
          if-no-files-found: error

  # Bundle smoke (feature #13 Phase 2, AC4/AC5), permanent. Stub Revit.exe
  # files let RST.msi's launch condition pass.
  #   Chain        the test bundle with the fixture companion: the spec's
  #                install-order table (ticked, re-run, uninstall, unticked,
  #                older / newer / same fixture installed first).
  #   BareMsiFirst bare RST.msi, then the bundle, then its uninstall (AC5).
  #   Companions   the real RST-Setup.exe with Gantt-It and Splash-It ticked:
  #                silent install, own ARP entries, .addin files, survive the
  #                bundle's uninstall, install alone without RST. Revit is a
  #                stub here; loading in Revit is the VM's check (AC6).
  #   UI           the real RST-Setup.exe driven through its own UI (UI
  #                Automation): the install-scope radio buttons and their
  #                wording (feature #17), the companion checkboxes, the finish
  #                page's "companions stay installed" note; screenshots uploaded.
  #   Scope        the test bundle on both install-scope paths (feature #17,
  #                AC10): "Just for me" (the default) launches no elevated
  #                engine; "Everyone on this PC" launches exactly one, installs
  #                RST-Machine.msi, then removes the user's own RST.msi (an older
  #                build, the same version, v2.2.0 with the retired R27 preview),
  #                keeps the scope on re-runs,
  #                installs over a hand-copied manifest, rolls back while
  #                Revit runs (the user keeps RST), uninstalls cleanly. UI checks the
  #                locked "Just for me" while RST-Machine.msi is installed.
  bundle-smoke:
    name: Bundle smoke (${{ matrix.mode }})
    needs: bundle
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [Chain, BareMsiFirst, Companions, UI, Scope]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: rst/
      - uses: actions/download-artifact@v4
        if: matrix.mode == 'Scope'
        with:
          name: msi-test
          path: msi-test/
      # Scope S6 (review B2): a v2.2.0 user with RST.msi and the retired
      # RST-R27.msi preview, the pinned public assets msi-migrate also uses.
      - name: Download v2.2.0 RST.msi and RST-R27.msi
        if: matrix.mode == 'Scope'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.2.0 -R "${{ github.repository }}" -p RST.msi -D v220
          gh release download v2.2.0 -R "${{ github.repository }}" -p RST-R27.msi -D v220
      # UI: the locked "Just for me" state needs RST-Machine.msi installed bare.
      - uses: actions/download-artifact@v4
        if: matrix.mode == 'UI'
        with:
          name: RST-Machine.msi
          path: rst/
      - uses: actions/download-artifact@v4
        with:
          name: RST-Setup.exe
          path: setup/
      - uses: actions/download-artifact@v4
        with:
          name: bundle-test
          path: bundle-test/
      - name: Download and verify companion pins
        if: matrix.mode == 'Companions' || matrix.mode == 'UI'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: installer-bundle/fetch-companions.ps1
      - name: Smoke (${{ matrix.mode }})
        shell: pwsh
        run: |
          $mode = '${{ matrix.mode }}'
          if ($mode -eq 'UI') { installer-bundle/ci-bundle-ui.ps1 -Bundle setup/RST-Setup.exe -RstMachineMsi rst/RST-Machine.msi -RstMsi rst/RST.msi; exit $LASTEXITCODE }
          $bundle = if ($mode -eq 'Companions') { 'setup/RST-Setup.exe' } else { 'bundle-test/test/RST-Setup-Fixture.exe' }
          installer-bundle/ci-bundle-smoke.ps1 -Mode $mode -Bundle $bundle -RstMsi rst/RST.msi -FixtureDir bundle-test/test -OlderRstMsi msi-test/RST-older.msi -V220RstMsi v220/RST.msi -V220PreviewMsi v220/RST-R27.msi
      - name: Upload Burn and msiexec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-smoke-logs-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/bundle-*.log
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/bundle-ui/*.png
          if-no-files-found: ignore

  # SHA256SUMS.txt (feature #17, spec #20 §8): release.yml writes it with
  # build/sha256sums.sh and checks the DRAFT release against it before it
  # publishes. This runs the same script on every PR over this build's RST.msi,
  # RST-Machine.msi and RST-Setup.exe: the lines name exactly the assets and verify, and the release
  # check refuses a wrong or missing digest, a missing or extra line, and a sums asset that differs.
  release-sums:
    name: Release SHA256SUMS.txt
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: RST-Machine.msi
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: RST-Setup.exe
          path: artifacts/
      - run: build/sha256sums.sh self-test artifacts RST.msi RST-Machine.msi RST-Setup.exe
      # WU3 review D1: release.yml's gh calls (one draft per tag, by id; a
      # re-run deletes its own stale draft, never a published release), run
      # against a fake gh. Nothing is sent to GitHub.
      - run: build/release-draft.sh self-test

  # Companion detection (feature #17, spec #20 §6, AC5's fixture half): the
  # tray's MsiProducts and ProductDetection against spec #15's fixture
  # companion MSI, installed per user, upgraded, installed per machine and
  # hand-copied as a bare .addin. Each scenario's versions and context must
  # match what Windows Installer reports. The fixture MSIs are built here from
  # the same project, versions and options as the bundle job
  # (installer-bundle/ci-bundle-build.ps1), so this job needs no RST.msi and
  # runs beside the MSI and bundle smokes.
  tray-detect:
    name: Tray detection (fixture MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the fixture companion MSIs (1.0.0, 1.1.0, 2.0.0)
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force fixture-msi
          foreach ($v in '1.0.0', '1.1.0', '2.0.0') {
            dotnet build installer-bundle/fixture/RST.CompanionFixture.wixproj -c Release --nologo "-p:FixtureVersion=$v" "-p:IntermediateOutputPath=obj\v$v\"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "installer-bundle/fixture/bin/Release/RST-CompanionFixture-$v.msi" $out
          }
          Get-ChildItem $out | Format-Table Name, Length
      - run: dotnet build src/RST.RuntimeTests/RST.RuntimeTests.csproj -c "Release R25" --nologo
      - name: Detection smoke
        shell: pwsh
        run: installer/ci-tray-detect.ps1 -FixtureDir fixture-msi
      - name: Upload detection results and msiexec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-detect
          path: ${{ runner.temp }}/tray-detect/
          if-no-files-found: ignore

  # Verified installs (feature #17, spec #20 §5, AC6, and AC7's CI
  # analogue): the tray's real install path (msi.dll, System32's msiexec,
  # the Revit.exe watch) against a fake GitHub serving the fixture
  # companion MSI. Every unverified MSI is refused with a logged reason; the
  # good one installs, waits while a Revit.exe runs, refuses a downgrade,
  # survives a failed upgrade and reinstalls the previous version.
  tray-install:
    name: Tray installs (fixture MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the fixture companion MSIs (1.0.0, 1.1.0, 2.0.0)
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force fixture-msi
          foreach ($v in '1.0.0', '1.1.0', '2.0.0') {
            dotnet build installer-bundle/fixture/RST.CompanionFixture.wixproj -c Release --nologo "-p:FixtureVersion=$v" "-p:IntermediateOutputPath=obj\v$v\"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "installer-bundle/fixture/bin/Release/RST-CompanionFixture-$v.msi" $out
          }
      - run: dotnet build src/RST.RuntimeTests/RST.RuntimeTests.csproj -c "Release R25" --nologo
      - name: Install smoke
        shell: pwsh
        run: installer/ci-tray-install.ps1 -FixtureDir fixture-msi
      - name: Upload install results and msiexec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-install
          path: ${{ runner.temp }}/tray-install/
          if-no-files-found: ignore

  # RST updates itself (feature #17, spec #20 §5, AC8): this commit's
  # RST.msi built at 3.1.90, 3.1.91 and 3.1.92. The installed tray's
  # verified download and its updater copy (RST.TrayUpdater.exe) take
  # 3.1.90 to 3.1.91, then 3.1.92 with the tray still running (Restart
  # Manager's restart racing the updater's start): one tray, one RST entry.
  # Then decision #34: RST installed by RST-Setup.exe 3.1.90 is updated with
  # RST-Setup.exe 3.1.91 (one entry, the bundle's), and the bundle's own
  # uninstall still removes it.
  tray-selfupdate:
    name: Tray self-update (RST.msi builds)
    needs: [stage, stage-tray]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: stage-R25
          path: build/R25/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R26
          path: build/R26/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R27
          path: build/R27/
      - uses: actions/download-artifact@v4
        with:
          name: stage-Tray
          path: build/Tray/
      - name: Build RST.msi at 3.1.90, 3.1.91 and 3.1.92
        shell: pwsh
        run: |
          dotnet restore installer/RST.Installer.wixproj --nologo
          foreach ($v in '3.1.90', '3.1.91', '3.1.92') {
            dotnet build installer/RST.Installer.wixproj -c Release --nologo --no-restore -t:Rebuild "-p:RstMsiVersion=$v"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item installer/bin/Release/RST.msi "$env:RUNNER_TEMP/RST-$v.msi"
          }
      # Decision #34: RST-Setup.exe at 3.1.90 and 3.1.91 around those RST.msi builds, from a copy of the
      # companion registry with nothing shippable (as the bundle job's RST-Setup-none.exe), so no companion
      # download is needed. Same Bundle.wxs, same bundle UpgradeCode.
      - name: Build RST-Setup.exe at 3.1.90 and 3.1.91 (no companions)
        shell: pwsh
        run: |
          $reg = Get-Content -Raw -Encoding UTF8 companions/companions.json | ConvertFrom-Json
          foreach ($c in $reg.companions) { $c.status = 'in_development'; $c.release = $null }
          $none = Join-Path $env:RUNNER_TEMP 'companions-none.json'
          $reg | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 $none
          # The bundle also chains RST-Machine.msi ("Everyone on this PC", F17 WU5). These legs take the default
          # "Just for me" path, so it is never installed here; one build of this commit serves both bundles.
          dotnet build installer/RST.Installer.wixproj -c Release --nologo -p:RstScope=machine -p:RstMsiVersion=3.1.91
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $machine = Join-Path $env:RUNNER_TEMP 'RST-Machine.msi'
          Copy-Item installer/bin/Release/RST-Machine.msi $machine
          foreach ($v in '3.1.90', '3.1.91') {
            dotnet build installer-bundle/RST.Setup.wixproj -c Release --nologo "-p:RstMsi=$env:RUNNER_TEMP/RST-$v.msi" "-p:RstMachineMsi=$machine" "-p:RstBundleVersion=$v" "-p:CompanionRegistry=$none" "-p:OutputName=RST-Setup" "-p:IntermediateOutputPath=obj\b$v\"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item installer-bundle/bin/Release/RST-Setup.exe "$env:RUNNER_TEMP/RST-Setup-$v.exe"
          }
          Get-ChildItem "$env:RUNNER_TEMP/RST-Setup-*.exe" | ForEach-Object { "{0} {1} {2}" -f $_.Name, $_.Length, $_.VersionInfo.FileVersion }
      - run: dotnet build src/RST.RuntimeTests/RST.RuntimeTests.csproj -c "Release R25" --nologo
      - name: Self-update smoke
        shell: pwsh
        run: >-
          installer/ci-tray-selfupdate.ps1
          -OldMsi "$env:RUNNER_TEMP/RST-3.1.90.msi" -OldVersion 3.1.90
          -NewMsi "$env:RUNNER_TEMP/RST-3.1.91.msi" -NewVersion 3.1.91
          -NewerMsi "$env:RUNNER_TEMP/RST-3.1.92.msi" -NewerVersion 3.1.92
          -OldBundle "$env:RUNNER_TEMP/RST-Setup-3.1.90.exe" -NewBundle "$env:RUNNER_TEMP/RST-Setup-3.1.91.exe"
      - name: Upload self-update results and msiexec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-selfupdate
          path: |
            ${{ runner.temp }}/tray-selfupdate/
          if-no-files-found: ignore
      # The three test builds, for AC8's VM half (shared/evidence/f17/wu4/vm-steps.md). Test-only, never released.
      - name: Upload the RST.msi test builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-selfupdate-msi
          path: |
            ${{ runner.temp }}/RST-3.1.9*.msi
            ${{ runner.temp }}/RST-Setup-3.1.9*.exe
          if-no-files-found: ignore
