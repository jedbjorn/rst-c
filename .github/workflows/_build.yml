name: _build (reusable)

# RST-013 — Reusable build pipeline for the multi-Revit MSI path.
# Called by build.yml (push/PR) and release.yml (v* tags). Filename is
# `_build.yml` (leading underscore) to flag "internal — don't trigger
# directly" by convention.
#
#   • test         — the Revit API floor check (decision #26:
#                    build/check-revit-api-floor.py fails on any
#                    Nice3point.Revit.Api pin above the year's earliest
#                    update), then xunit on RST.Tests (configuration-agnostic)
#   • test-runtime — matrix R25/R27: xunit on RST.RuntimeTests (Windows-
#                    only WPF paths: bridge + resolver production
#                    contracts) on net8.0-windows and net10.0-windows.
#   • serilog-probe — builds the AAA/ZZZ Serilog probe add-ins (VM step V3,
#                    decision #27) and uploads the SerilogProbe artifact.
#                    Never shipped.
#   • stage        — matrix R25/R26/R27, runs build/stage.sh per major,
#                    uploads the bundle as a per-major artifact. Every
#                    major is a hard gate: an R27 failure fails the
#                    workflow and blocks a release (feature #11, D7: no
#                    skip-R27 switch).
#   • stage-tray   — build/stage.sh tray: RST.Tray.exe once, not per major
#                    (feature #17), uploaded as stage-Tray.
#   • msi-unified  — Windows runner. Downloads R25 + R26 + R27 artifacts,
#                    runs installer/RST.Installer.wixproj → RST.msi (all
#                    three majors in one MSI; each installs only when that
#                    Revit year is detected), then a permanent smoke with
#                    stub Revit.exe files (installer/ci-smoke.ps1 -Mode
#                    Install): Component-table check, detected years only,
#                    no-Revit refusal, Repair adds/drops a year, uninstall.
#   • msi-migrate  — Windows runner, matrix v2.2.0 Preview/Unified and
#                    v3.0.0 Unified. Installs the public v2.2.0 RST-R27.msi
#                    or RST.msi, or the v3.0.0 RST.msi, then the new
#                    RST.msi, and asserts the preview is removed / the
#                    unified product upgrades in place.
#   • bundle       — Windows runner. Downloads + sha256-verifies the pinned
#                    companion MSIs (companions/companions.json), builds
#                    installer-bundle/RST.Setup.wixproj → RST-Setup.exe
#                    (feature #13), plus the smoke's fixture test bundle.
#   • bundle-smoke — Windows runner, matrix Chain/BareMsiFirst/Companions:
#                    installer-bundle/ci-bundle-smoke.ps1 (install order,
#                    bare RST.msi first, the real companions).
#
# WiX MSI emission is officially Windows-only (installer/README.md). The
# WiX SDK MSBuild path on Linux emits WIX0000 ("behavior is undefined")
# and trips WIX0389 on every Directory/@Name. Stage jobs stay on Linux —
# `dotnet build` of net8/net10-windows TFMs works there via
# EnableWindowsTargeting. Only the WiX step pays the Windows-runner cost.

on:
  workflow_call:
    inputs:
      product_version:
        description: >-
          Numeric MSI ProductVersion (a.b.c) to stamp into RST.msi. Empty for
          push/PR builds — the wixproj fallback applies. release.yml derives it
          from the tag so a release always raises ProductVersion (MajorUpgrade).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:

  test:
    name: Test (xunit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revit API floor (decision #26)
        run: python3 build/check-revit-api-floor.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test src/RST.Tests/RST.Tests.csproj -c Release --nologo

  # RuntimeTests invokes the real WPF assemblies (the windows, IconAssets)
  # — it can only RUN on Windows. No Revit needed, so windows-latest
  # suffices and the self-hosted Revit runner stays out of the PR gate.
  # R27 leg (feature #11, D5): the same contracts on net10.0-windows.
  test-runtime:
    name: Test (runtime, Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        major: [R25, R27]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-dotnet@v4
        if: matrix.major == 'R27'
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test src/RST.RuntimeTests/RST.RuntimeTests.csproj -c "Release ${{ matrix.major }}" --nologo
      # Spec #16 screenshot pipeline: the runtime tests write PNGs (and a
      # capture-environment .txt) under TestResults/screenshots. Uploaded even
      # when a test fails, so a broken render can be looked at. One upload per
      # run: this job is a per-major matrix (feature #11) and only the R25
      # leg uploads, so the fixed artifact name never collides.
      - name: List screenshots
        if: always() && matrix.major != 'R27'
        shell: bash
        run: find TestResults/screenshots -type f -exec ls -l {} + || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.major != 'R27'
        with:
          name: RST-screenshots
          path: |
            TestResults/screenshots/*.png
            TestResults/screenshots/*.txt
          if-no-files-found: error

  # Decision #27 (research V3): the two Serilog probe add-ins the VM run
  # installs beside RST (tests/fixtures/SerilogProbe: AAA ships Serilog 3.1.1
  # and its own resolver, ZZZ ships Serilog 4.2.0; 2026 net8 and 2027 net10,
  # plus the guest helper serilog-probe.ps1). Never shipped: release.yml
  # takes RST.msi only.
  serilog-probe:
    name: SerilogProbe (test add-ins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build AAA and ZZZ for R26 and R27
        run: |
          for p in AAA ZZZ; do
            for c in "Release R26" "Release R27"; do
              dotnet build "tests/fixtures/SerilogProbe/$p/$p-SerilogProbe.csproj" -c "$c" --nologo
            done
          done
      - run: bash tests/fixtures/SerilogProbe/package.sh out/SerilogProbe
      - uses: actions/upload-artifact@v4
        with:
          name: SerilogProbe
          path: out/SerilogProbe/
          if-no-files-found: error

  stage:
    name: Stage ${{ matrix.major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: R25
          - major: R26
          - major: R27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # SDK 10 is GA (10.0.203 as of 2026-05-10); install alongside SDK 8
      # only when building R27 to keep R25/R26 jobs lean.
      - uses: actions/setup-dotnet@v4
        if: matrix.major == 'R27'
        with:
          dotnet-version: '10.0.x'
      - run: build/stage.sh ${{ matrix.major }} Release
      - uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.major }}
          path: build/${{ matrix.major }}/
          if-no-files-found: error

  # RST tray (feature #17, spec #20 §1): RST.Tray.exe is built once, not per
  # Revit year (net8.0-windows, RollForward=Major), by build/stage.sh tray
  # into build/Tray/. RST.msi's Main feature installs it; the version stamp
  # is the release's a.b.c (0.0.0-dev on push/PR builds).
  stage-tray:
    name: Stage Tray
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: build/stage.sh tray Release
        env:
          RST_VERSION: ${{ inputs.product_version }}
      - uses: actions/upload-artifact@v4
        with:
          name: stage-Tray
          path: build/Tray/
          if-no-files-found: error

  msi-unified:
    name: MSI (R25 + R26 + R27)
    needs: [stage, stage-tray]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # SDK 8 only: the MSI carries files, so the R27 net10 payload needs
      # no .NET 10 here.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: stage-R25
          path: build/R25/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R26
          path: build/R26/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R27
          path: build/R27/
      - uses: actions/download-artifact@v4
        with:
          name: stage-Tray
          path: build/Tray/
      - run: dotnet build installer/RST.Installer.wixproj -c Release --nologo -p:RstMsiVersion=${{ inputs.product_version }}
      # Rebuild the same commit: same ProductVersion, new ProductCode. That
      # is the rc -> final case (release.yml strips -rc.N) the smoke below
      # checks against AllowSameVersionUpgrades. The rebuilt RST.msi is the
      # one uploaded.
      - name: Same-version rebuild
        shell: pwsh
        run: |
          Copy-Item installer/bin/Release/RST.msi "$env:RUNNER_TEMP/RST-first.msi"
          dotnet build installer/RST.Installer.wixproj -c Release --nologo --no-restore -t:Rebuild -p:RstMsiVersion=${{ inputs.product_version }}
      # Permanent install/uninstall smoke (feature #11, D6 / AC3, decision
      # #10). Stub Revit.exe files under C:\Program Files\Autodesk\Revit
      # <year>\ drive the detection: no Revit is refused, only detected
      # years install, Repair adds/drops a year, a same-version build and a
      # repeated install leave one product, uninstall removes every tree,
      # user data survives. -StagedRoot checks per-year component counts.
      - name: Install / uninstall smoke
        shell: pwsh
        run: installer/ci-smoke.ps1 -Mode Install -Msi "$env:RUNNER_TEMP/RST-first.msi" -SameVersionMsi installer/bin/Release/RST.msi -StagedRoot build
      - uses: actions/upload-artifact@v4
        with:
          name: RST.msi
          path: installer/bin/Release/RST.msi
          if-no-files-found: error

  # Upgrade paths from released MSIs (feature #11, AC4/AC5).
  # v2.2.0 is pinned: it is the final release that shipped RST-R27.msi.
  # v3.0.0 is the first unified release: the PR build (fallback 3.0.99,
  # flag SC-004) must upgrade it in place.
  msi-migrate:
    name: MSI upgrade from ${{ matrix.release }} (${{ matrix.from }})
    needs: msi-unified
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: v2.2.0
            from: Preview
            asset: RST-R27.msi
          - release: v2.2.0
            from: Unified
            asset: RST.msi
          - release: v3.0.0
            from: Unified
            asset: RST.msi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: new/
      - uses: actions/download-artifact@v4
        with:
          name: stage-R27
          path: build/R27/
      - name: Download ${{ matrix.release }} ${{ matrix.asset }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ matrix.release }} -R "${{ github.repository }}" -p "${{ matrix.asset }}" -D old
      - name: Upgrade from ${{ matrix.release }} ${{ matrix.asset }}
        shell: pwsh
        run: installer/ci-smoke.ps1 -Mode Migrate -From ${{ matrix.from }} -Msi new/RST.msi -OldMsi "old/${{ matrix.asset }}" -StagedR27 build/R27

  # Setup bundle (feature #13 Phase 2, spec #15, AC3). Downloads each
  # shippable companion's pinned release asset and fails on a missing asset
  # or a sha256 / UpgradeCode / version mismatch; then builds RST-Setup.exe
  # (RST.msi + the shippable companions, from companions/companions.json),
  # a zero-shippable variant, the fixture companion and the smoke's test
  # bundle, and checks by /layout that each embeds exactly what it should.
  bundle:
    name: Bundle (RST-Setup.exe)
    needs: msi-unified
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: installer/bin/Release/
      - name: Download and verify companion pins
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: installer-bundle/fetch-companions.ps1
      - name: Build bundles and check what they embed
        shell: pwsh
        run: installer-bundle/ci-bundle-build.ps1 -Version "${{ inputs.product_version }}" -RstMsi installer/bin/Release/RST.msi
      - uses: actions/upload-artifact@v4
        with:
          name: RST-Setup.exe
          path: installer-bundle/bin/Release/RST-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-test
          path: installer-bundle/bin/ci/
          if-no-files-found: error

  # Bundle smoke (feature #13 Phase 2, AC4/AC5), permanent. Stub Revit.exe
  # files let RST.msi's launch condition pass.
  #   Chain        the test bundle with the fixture companion: the spec's
  #                install-order table (ticked, re-run, uninstall, unticked,
  #                older / newer / same fixture installed first).
  #   BareMsiFirst bare RST.msi, then the bundle, then its uninstall (AC5).
  #   Companions   the real RST-Setup.exe with Gantt-It and Splash-It ticked:
  #                silent install, own ARP entries, .addin files, survive the
  #                bundle's uninstall, install alone without RST. Revit is a
  #                stub here; loading in Revit is the VM's check (AC6).
  #   UI           the real RST-Setup.exe driven through its own UI (UI
  #                Automation): the companion checkboxes, the finish page's
  #                "companions stay installed" note; screenshots uploaded.
  bundle-smoke:
    name: Bundle smoke (${{ matrix.mode }})
    needs: bundle
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [Chain, BareMsiFirst, Companions, UI]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: rst/
      - uses: actions/download-artifact@v4
        with:
          name: RST-Setup.exe
          path: setup/
      - uses: actions/download-artifact@v4
        with:
          name: bundle-test
          path: bundle-test/
      - name: Download and verify companion pins
        if: matrix.mode == 'Companions' || matrix.mode == 'UI'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: installer-bundle/fetch-companions.ps1
      - name: Smoke (${{ matrix.mode }})
        shell: pwsh
        run: |
          $mode = '${{ matrix.mode }}'
          if ($mode -eq 'UI') { installer-bundle/ci-bundle-ui.ps1 -Bundle setup/RST-Setup.exe; exit $LASTEXITCODE }
          $bundle = if ($mode -eq 'Companions') { 'setup/RST-Setup.exe' } else { 'bundle-test/test/RST-Setup-Fixture.exe' }
          installer-bundle/ci-bundle-smoke.ps1 -Mode $mode -Bundle $bundle -RstMsi rst/RST.msi -FixtureDir bundle-test/test
      - name: Upload Burn and msiexec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-smoke-logs-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/bundle-*.log
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/bundle-ui/*.png
          if-no-files-found: ignore
