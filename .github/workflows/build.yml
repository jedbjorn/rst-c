name: build

# Push/PR-time CI. Delegates to the reusable _build.yml so release.yml
# can share the exact same matrix without drift.

on:
  push:
    branches: [main]
  # feat/**: a PR stacked on another feature branch (e.g. F17 WU3 on
  # feat/tray-core) gets the same gate before it is retargeted to main.
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

# A new push to a PR cancels that PR's older, still-running build: only the
# newest head's result can gate a merge. Pushes to main group by commit SHA,
# so every main build runs to completion and none cancels another.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    # Build-only integration candidate; this branch must not be merged.
    with:
      product_version: '3.2.2'
