name: build

# Push/PR-time CI. Delegates to the reusable _build.yml so release.yml
# can share the exact same matrix without drift.

on:
  push:
    branches: [main]
  # feat/**: a PR stacked on another feature branch (e.g. F17 WU3 on
  # feat/tray-core) gets the same gate before it is retargeted to main.
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

# A new push to a PR cancels that PR's older, still-running build: only the
# newest head's result can gate a merge. Pushes to main group by commit SHA,
# so every main build runs to completion and none cancels another.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  # The post-release bump (installer/README.md, "Untagged builds"): fails when
  # RstDevVersion is not above the latest published release, or msi-migrate has
  # no leg for it. Here, not in _build.yml, so it never blocks a release run.
  dev-version:
    name: Dev version above latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check RstDevVersion and the msi-migrate leg
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/check-dev-version.py "$(gh release view -R "${{ github.repository }}" --json tagName -q .tagName)"
