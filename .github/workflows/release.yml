name: release

# RST-013 phase 3 — tag-driven GitHub Release.
#
# Push a tag matching `v*` (e.g. `v0.1.0`, `v1.0.0`, `v0.2.0-rc.1`) and
# this workflow:
#   1. Runs the full _build.yml pipeline against the tagged commit.
#   2. Downloads the produced MSI artifacts.
#   3. Creates a GitHub Release with the MSIs attached, auto-generated
#      release notes, and pre-release flag set when the tag carries a
#      hyphenated suffix (alpha/beta/rc).
#
# Tag → Release. Nothing else triggers a release; pushes to main do not
# auto-tag.
#
# Versioning: the MSI's <Package Version="…"> is threaded from the tag.
# The `prepare` job strips the leading `v` and any `-prerelease` suffix to a
# numeric a.b.c and passes it to _build.yml, which stamps both MSIs. So the
# installed ProductVersion always matches the tag and a new tag always raises
# it — driving MajorUpgrade / RemoveExistingProducts on in-place upgrade.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:

  prepare:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"   # v1.3.0 / v1.3.0-rc.1 → 1.3.0(-rc.1)
          version="${tag%%-*}"         # strip -prerelease → numeric a.b.c for MSI
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSI ProductVersion: $version (tag ${GITHUB_REF_NAME})"

  build:
    needs: prepare
    uses: ./.github/workflows/_build.yml
    with:
      product_version: ${{ needs.prepare.outputs.version }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: ./artifacts/
      # R27 MSI is soft-fail upstream; tolerate its artifact being absent.
      - uses: actions/download-artifact@v4
        with:
          name: RST-R27.msi
          path: ./artifacts/
        continue-on-error: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Hyphenated tags (v1.0.0-rc.1, v0.2.0-alpha) → pre-release.
          prerel=()
          if [[ "$tag" == *-* ]]; then
            prerel=(--prerelease)
          fi
          # Upload whatever MSIs are present in artifacts/. R27 may be
          # missing if its stage soft-failed.
          gh release create "$tag" \
            artifacts/*.msi \
            --title "$tag" \
            --generate-notes \
            "${prerel[@]}"
