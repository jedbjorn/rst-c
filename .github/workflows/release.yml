name: release

# RST-013 phase 3 — tag-driven GitHub Release.
#
# Push a tag matching `v*` (e.g. `v0.1.0`, `v1.0.0`, `v0.2.0-rc.1`) and
# this workflow:
#   1. Runs the full _build.yml pipeline against the tagged commit.
#   2. Downloads the produced RST.msi artifact (Revit 2025 + 2026 + 2027).
#   3. Creates a GitHub Release with RST.msi attached, auto-generated
#      release notes, and pre-release flag set when the tag carries a
#      hyphenated suffix (alpha/beta/rc).
#   4. Also attaches RST-Setup.exe (feature #13): the setup bundle, RST.msi
#      plus the opt-in companion add-ins pinned in companions/companions.json.
#      Its bundle version is the same numeric a.b.c; a same-version bundle
#      (rc -> final) replaces the installed one (Burn treats an equal
#      version as an upgrade).
#   5. Also attaches SHA256SUMS.txt (feature #17, spec #20 §8), one line
#      per asset, and checks the published release against it.
#
# Tag → Release. Nothing else triggers a release; pushes to main do not
# auto-tag.
#
# Versioning: the MSI's <Package Version="…"> is threaded from the tag.
# The `prepare` job strips the leading `v` and any `-prerelease` suffix to a
# numeric a.b.c and passes it to _build.yml, which stamps RST.msi. So the
# installed ProductVersion always matches the tag's a.b.c, driving
# MajorUpgrade / RemoveExistingProducts on in-place upgrade. An rc and its
# final (v3.0.0-rc.N, v3.0.0) share a.b.c: that same-version upgrade relies
# on AllowSameVersionUpgrades="yes" in installer/Product.wxs.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:

  prepare:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"   # v1.3.0 / v1.3.0-rc.1 → 1.3.0(-rc.1)
          version="${tag%%-*}"         # strip -prerelease → numeric a.b.c for MSI
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSI ProductVersion: $version (tag ${GITHUB_REF_NAME})"

  build:
    needs: prepare
    uses: ./.github/workflows/_build.yml
    with:
      product_version: ${{ needs.prepare.outputs.version }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: ./artifacts/
      # The setup bundle (feature #13): RST.msi + opt-in companion add-ins.
      - uses: actions/download-artifact@v4
        with:
          name: RST-Setup.exe
          path: ./artifacts/
      # SHA256SUMS.txt (feature #17, spec #20 §8): one `sha256sum` line per
      # attached asset. The RST tray installs a download only when its hash
      # matches its line here and GitHub's own asset digest (WU4). Written
      # and checked (names exactly the assets, every hash verifies) before
      # anything is published.
      - name: SHA256SUMS.txt
        run: build/sha256sums.sh write artifacts RST.msi RST-Setup.exe
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Hyphenated tags (v1.0.0-rc.1, v0.2.0-alpha) → pre-release.
          prerel=()
          if [[ "$tag" == *-* ]]; then
            prerel=(--prerelease)
          fi
          # Attach RST.msi, RST-Setup.exe and SHA256SUMS.txt by name so a
          # stray artifact can never ship. One `gh release create` with every
          # asset: gh uploads them to a draft and publishes it complete, the
          # one-step publish that immutable releases need (assets and tag are
          # fixed at publication).
          gh release create "$tag" \
            artifacts/RST.msi \
            artifacts/RST-Setup.exe \
            artifacts/SHA256SUMS.txt \
            --title "$tag" \
            --generate-notes \
            "${prerel[@]}"
      # The published release, as GitHub serves it: SHA256SUMS.txt lists
      # exactly its other assets, and each line equals GitHub's digest.
      - name: Check the published release against SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --json assets > "$RUNNER_TEMP/release-assets.json"
          gh release download "$tag" -p SHA256SUMS.txt -D "$RUNNER_TEMP/published"
          build/sha256sums.sh check-release "$RUNNER_TEMP/published/SHA256SUMS.txt" "$RUNNER_TEMP/release-assets.json"
