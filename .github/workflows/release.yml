name: release

# RST-013 phase 3 — tag-driven GitHub Release.
#
# Push a tag matching `v*` (e.g. `v0.1.0`, `v1.0.0`, `v0.2.0-rc.1`) and
# this workflow:
#   1. Runs the full _build.yml pipeline against the tagged commit.
#   2. Downloads the produced RST.msi artifact (Revit 2025 + 2026 + 2027).
#   3. Creates a GitHub Release with RST.msi attached, auto-generated
#      release notes, and pre-release flag set when the tag carries a
#      hyphenated suffix (alpha/beta/rc).
#   4. Also attaches RST-Setup.exe (feature #13): the setup bundle, RST.msi
#      plus the opt-in companion add-ins pinned in companions/companions.json.
#      Its bundle version is the same numeric a.b.c; a same-version bundle
#      (rc -> final) replaces the installed one (Burn treats an equal
#      version as an upgrade).
#   5. Also attaches SHA256SUMS.txt (feature #17, spec #20 §8), one line
#      per asset. The release is created as a DRAFT, verified against
#      GitHub's digests of the uploads, and only then published.
#
# Tag → Release. Nothing else triggers a release; pushes to main do not
# auto-tag.
#
# Versioning: the MSI's <Package Version="…"> is threaded from the tag.
# The `prepare` job strips the leading `v` and any `-prerelease` suffix to a
# numeric a.b.c and passes it to _build.yml, which stamps RST.msi. So the
# installed ProductVersion always matches the tag's a.b.c, driving
# MajorUpgrade / RemoveExistingProducts on in-place upgrade. An rc and its
# final (v3.0.0-rc.N, v3.0.0) share a.b.c: that same-version upgrade relies
# on AllowSameVersionUpgrades="yes" in installer/Product.wxs.

on:
  push:
    tags: ['v*']

# One release run per tag at a time (WU4 review N7): a re-pushed tag waits for the run before it, never
# overlapping its draft clean-up.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  prepare:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"   # v1.3.0 / v1.3.0-rc.1 → 1.3.0(-rc.1)
          version="${tag%%-*}"         # strip -prerelease → numeric a.b.c for MSI
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSI ProductVersion: $version (tag ${GITHUB_REF_NAME})"

  build:
    needs: prepare
    uses: ./.github/workflows/_build.yml
    with:
      product_version: ${{ needs.prepare.outputs.version }}

  release:
    name: GitHub Release
    needs: build
    env:
      # The release's assets, in ONE place: SHA256SUMS.txt lists them and release-draft.sh attaches them
      # (with SHA256SUMS.txt). Adding RST-Machine.msi (WU5) is this one line.
      RELEASE_ASSETS: RST.msi RST-Setup.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RST.msi
          path: ./artifacts/
      # The setup bundle (feature #13): RST.msi + opt-in companion add-ins.
      - uses: actions/download-artifact@v4
        with:
          name: RST-Setup.exe
          path: ./artifacts/
      # SHA256SUMS.txt (feature #17, spec #20 §8): one `sha256sum` line per
      # attached asset. The RST tray installs a download only when its hash
      # matches its line here and GitHub's own asset digest (WU4). Written
      # and checked (names exactly the assets, every hash verifies) before
      # anything is published.
      - name: SHA256SUMS.txt
        run: build/sha256sums.sh write artifacts $RELEASE_ASSETS
      # Draft → verify → publish. With immutable releases on (P3) a release's
      # assets and tag lock at publication, so nothing is published until the
      # uploaded assets are proven: a mismatch leaves an unpublished draft
      # (fix and re-run) instead of a frozen release every tray refuses.
      #
      #
      # One draft per tag, addressed by its id (WU3 review D1): Actions'
      # "re-run failed jobs" re-runs this whole job, and a draft left by the
      # failed run would otherwise sit beside a second one for the same tag.
      # build/release-draft.sh holds every gh call; its self-test (CI job
      # "Release SHA256SUMS.txt") runs them against a fake gh.
      #
      # 0. A published release for the tag is refused (never replaced);
      #    unpublished drafts an earlier run left for it are deleted by id.
      - name: Clear stale drafts for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/release-draft.sh prepare "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      # 1. A DRAFT with every asset, attached by name so a stray artifact can
      #    never ship. Hyphenated tags (v1.0.0-rc.1) are pre-releases from
      #    the start; the flag stays when the draft is published. Its id is
      #    the one draft for the tag (anything else fails here).
      - name: Create the release as a draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(build/release-draft.sh create "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" artifacts)"
          echo "draft $id for $GITHUB_REF_NAME"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # 2. That draft as GitHub holds it: SHA256SUMS.txt lists exactly its
      #    other assets, each line equals GitHub's digest of that upload, and
      #    the draft's own SHA256SUMS.txt is the file checked. A failure fails
      #    the job here and the draft stays unpublished (a re-run deletes it).
      - name: Verify the draft against SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/release-draft.sh verify "$GITHUB_REPOSITORY" "${{ steps.draft.outputs.id }}" "$GITHUB_REF_NAME" artifacts/SHA256SUMS.txt
      # 3. Only now publish that exact release: one step from a complete,
      #    verified draft.
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/release-draft.sh publish "$GITHUB_REPOSITORY" "${{ steps.draft.outputs.id }}" "$GITHUB_REF_NAME"
