<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Defense in depth: block exfiltration to external origins. Inline
     scripts/handlers/styles kept ('unsafe-inline'); connect/img/object/base/
     form locked down — the local UI never needs them. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RST — Health</title>
<link rel="stylesheet" href="rst_components.css">
<style>
  :root {
    --font-body: 'Segoe UI', system-ui, sans-serif;
    --font-display: 'Segoe UI', system-ui, sans-serif;
    --font-mono: Consolas, 'Courier New', monospace;
    --bg: #0f1117;
    --surface: #161b27;
    --surface2: #1e2536;
    --surface3: #242d42;
    --border: #2a3347;
    --border2: #3a4560;
    --accent: #4f8ef7;
    --accent3: #10b981;
    --warn-soft: #eab308;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --heading: #f8fafc;
    --header-h: 54px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .window-header {
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
    flex-shrink: 0;
  }

  .window-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--heading);
    letter-spacing: 0.01em;
  }

  .header-meta {
    margin-left: auto;
    display: flex;
    gap: 16px;
    align-items: baseline;
  }

  .header-meta span {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--text3);
  }

  .header-meta strong {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 12px;
    color: var(--text);
    margin-left: 6px;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .content-inner {
    max-width: 820px;
    margin: 0 auto;
  }

  /* ── EMPTY / ERROR STATE ─────────────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 64px 24px;
    color: var(--text3);
  }
  .empty-state h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    color: var(--text2);
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 13px;
    max-width: 420px;
    margin: 0 auto;
  }

  /* ── EXPANDABLE SECTION ──────────────────────────────────────────────── */
  .rst-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .rst-section[open] {
    border-color: var(--border2);
  }

  .rst-section__summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
    transition: background 0.12s;
  }

  .rst-section__summary::-webkit-details-marker { display: none; }

  .rst-section__summary:hover { background: var(--surface2); }

  .rst-section[open] .rst-section__summary {
    border-bottom: 1px solid var(--border);
  }

  .rst-section__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--heading);
    letter-spacing: 0.01em;
    flex: 1;
  }

  .rst-section__chevron {
    width: 8px;
    height: 8px;
    border-right: 1.5px solid var(--text2);
    border-bottom: 1.5px solid var(--text2);
    transform: rotate(-45deg);
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .rst-section[open] .rst-section__chevron {
    transform: rotate(45deg);
  }

  .rst-section__body {
    padding: 4px 18px 8px;
    background: var(--surface);
  }

  .rst-section__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text3);
  }
  .rst-section__dot--ok        { background: var(--accent3); }
  .rst-section__dot--warn-soft { background: var(--warn-soft); }
  .rst-section__dot--warn      { background: var(--warn); }
  .rst-section__dot--danger    { background: var(--danger); }
  .rst-section__dot--info      { background: var(--accent); }

  /* ── ROW ────────────────────────────────────────────────────────────── */
  .rst-section__row {
    display: flex;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .rst-section__row:last-child { border-bottom: none; }

  .rst-section__row-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--text3);
    width: 160px;
    flex-shrink: 0;
  }

  .rst-section__row-value {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
  }

  .rst-section__row-value--muted     { color: var(--text3); font-style: italic; }
  .rst-section__row-value--ok        { color: var(--accent3); }
  .rst-section__row-value--warn-soft { color: var(--warn-soft); }
  .rst-section__row-value--warn      { color: var(--warn); }
  .rst-section__row-value--danger    { color: var(--danger); }

  /* Inline sub-value (monospace, smaller) */
  .sub {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text3);
    margin-top: 3px;
    letter-spacing: 0.02em;
  }

  /* Severity tint applied to the entire .sub line */
  .sub--ok        { color: var(--accent3); }
  .sub--warn-soft { color: var(--warn-soft); }
  .sub--warn      { color: var(--warn); }
  .sub--danger    { color: var(--danger); }

  /* Severity tint applied to a single inline token inside a .sub
     (used when only part of the sub is dynamic, e.g. CPU %used) */
  .sub-accent--ok        { color: var(--accent3); }
  .sub-accent--warn-soft { color: var(--warn-soft); }
  .sub-accent--warn      { color: var(--warn); }
  .sub-accent--danger    { color: var(--danger); }

  /* ── FOOTER ──────────────────────────────────────────────────────────── */
  .window-footer {
    height: 52px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 8px;
    flex-shrink: 0;
  }

  .footer-spacer { flex: 1; }

  .rst-footer-btn {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    background: var(--surface3);
    color: var(--text);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .rst-footer-btn:hover { background: var(--surface2); }
  .rst-footer-btn[disabled] { opacity: 0.65; cursor: progress; }

  .rst-footer-btn--clean:hover {
    background: rgba(245,158,11,0.18);
    color: var(--warn);
    border-color: rgba(245,158,11,0.45);
  }

  .rst-footer-btn--scan {
    color: var(--danger);
    border-color: rgba(239,68,68,0.55);
    background: transparent;
  }
  .rst-footer-btn--scan:hover:not([disabled]) {
    background: rgba(239,68,68,0.14);
  }

  .rst-spinner {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid rgba(239,68,68,0.25);
    border-top-color: var(--danger);
    animation: rst-spin 0.7s linear infinite;
  }
  @keyframes rst-spin { to { transform: rotate(360deg); } }

  /* ── JUNK CLEANUP MODAL ──────────────────────────────────────────────── */
  .rst-junk-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 9000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .rst-junk-overlay.visible { opacity: 1; pointer-events: auto; }

  .rst-junk-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 24px 28px;
    width: 480px;
    max-width: 92%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }

  .rst-junk-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--heading);
    margin-bottom: 4px;
  }

  .rst-junk-subtitle {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--text3);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .rst-junk-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .rst-junk-row:last-of-type { border-bottom: none; }

  .rst-junk-row-text { flex: 1; }

  .rst-junk-row-label {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text);
  }

  .rst-junk-row-hint {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  .rst-junk-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 18px;
  }

  .rst-junk-btn {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 18px;
    cursor: pointer;
    background: var(--surface3);
    color: var(--text3);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .rst-junk-btn:hover { background: var(--surface2); }

  .rst-junk-btn--primary {
    background: rgba(245,158,11,0.18);
    color: var(--warn);
    border-color: rgba(245,158,11,0.45);
  }
  .rst-junk-btn--primary:hover { background: rgba(245,158,11,0.28); }

  /* ── TAB BAR (Health / Activity) ─────────────────────────────────────── */
  .tab-bar {
    display: flex;
    gap: 4px;
    align-self: stretch;
    align-items: stretch;
    margin-left: 8px;
  }
  .tab-btn {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text3);
    cursor: pointer;
    padding: 0 14px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--heading); border-bottom-color: var(--accent); }

  /* ── ACTIVITY TAB ────────────────────────────────────────────────────── */
  .act-session {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 18px;
    margin-bottom: 10px;
  }
  .act-session-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }
  .act-session-time {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    color: var(--heading);
    font-variant-numeric: tabular-nums;
  }
  .act-session-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
    min-height: 14px;
  }

  .act-range {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 3px;
    gap: 2px;
    margin-bottom: 10px;
  }
  .act-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    border: none;
    background: transparent;
    color: var(--text3);
    border-radius: 5px;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .act-pill:hover { color: var(--text); }
  .act-pill.active { background: var(--surface3); color: var(--heading); }

  .act-chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px 18px 10px;
    margin-bottom: 10px;
  }
  .act-chart-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--heading);
    margin-bottom: 8px;
  }
  .act-chart-body svg { display: block; width: 100%; height: auto; }
  .act-grid { stroke: var(--border); stroke-width: 1; }
  .act-axis-label { font-family: var(--font-mono); font-size: 9px; fill: var(--text3); }
  .act-line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .act-dot { fill: var(--accent); stroke: var(--bg); stroke-width: 1; }
  .act-dot:hover { r: 5; }
  .act-empty { text-align: center; padding: 28px 12px; color: var(--text3); }
  .act-empty-title { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
  .act-empty-hint { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; }

  /* Activity footer: collection toggle + status line */
  .footer-toggle-label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--text);
  }
  .footer-status {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--text3);
  }
</style>
<script src="rst_messages.js"></script>
</head>
<body>
  <div class="window-header">
    <div class="window-title">RST · HEALTH</div>
    <div class="tab-bar">
      <button type="button" class="tab-btn active" id="tabHealth" data-tab="health">Health</button>
      <button type="button" class="tab-btn" id="tabActivity" data-tab="activity">Activity</button>
    </div>
    <div class="header-meta">
      <span>DEVICE<strong data-field="device">—</strong></span>
      <span>CAPTURED<strong data-field="captured">—</strong></span>
    </div>
  </div>

  <div class="content rst-scroll">
    <div class="content-inner" id="sections">
      <!-- Sections rendered by JS -->
    </div>
    <div class="content-inner" id="activityPane" hidden>
      <div class="act-session">
        <div class="act-session-label">Current Session</div>
        <div class="act-session-time" id="actSessionTime">—</div>
        <div class="act-session-sub" id="actSessionSub"></div>
      </div>
      <div class="act-range" id="actRange">
        <button type="button" class="act-pill active" data-days="7">7D</button>
        <button type="button" class="act-pill" data-days="30">1M</button>
        <button type="button" class="act-pill" data-days="90">3M</button>
        <button type="button" class="act-pill" data-days="180">6M</button>
      </div>
      <div class="act-chart-card">
        <div class="act-chart-title">Session time — this file</div>
        <div class="act-chart-body" id="chartSessionBody"></div>
      </div>
      <div class="act-chart-card">
        <div class="act-chart-title">Opening time — this file</div>
        <div class="act-chart-body" id="chartOpenBody"></div>
      </div>
      <div class="act-chart-card">
        <div class="act-chart-title">Sync history — this file</div>
        <div class="act-chart-body" id="chartSyncBody"></div>
      </div>
    </div>
  </div>

  <div class="window-footer">
    <div id="footerHealth" style="display: contents">
      <button type="button" class="rst-footer-btn rst-footer-btn--scan" id="btnScan">
        <span class="rst-footer-btn__label">Scan System</span>
      </button>
      <div class="footer-spacer"></div>
      <button type="button" class="rst-footer-btn rst-footer-btn--clean" id="btnClean">Clean Junk Files</button>
    </div>
    <div id="footerActivity" style="display: none">
      <span class="footer-toggle-label">
        <label class="rst-toggle">
          <input type="checkbox" id="telemetryToggle">
          <div class="rst-toggle-track"><div class="rst-toggle-thumb"></div></div>
        </label>
        <span>Collection</span>
      </span>
      <span class="footer-status" id="telemetryStatusLine">—</span>
      <div class="footer-spacer"></div>
    </div>
    <button type="button" class="rst-footer-btn" id="btnClose">Close</button>
  </div>

  <!-- Cleanup modal — checkboxes rendered dynamically from the active
       profile's CleanupTargets (RST-031). Loader fills #junkRows on open;
       Run posts the checked target ids back to Bridge.clean_junk. -->
  <div class="rst-junk-overlay" id="junkOverlay">
    <div class="rst-junk-card">
      <div class="rst-junk-title">Clean Junk Files</div>
      <div class="rst-junk-subtitle">Deselect any target to skip. Files locked by running applications are skipped automatically.</div>

      <div id="junkRows"></div>

      <div class="rst-junk-actions">
        <button type="button" class="rst-junk-btn" id="junkCancel">Cancel</button>
        <button type="button" class="rst-junk-btn rst-junk-btn--primary" id="junkRun">Clean Selected</button>
      </div>
    </div>
  </div>

<script>
  const fmt = {
    mb(n) { return (n == null) ? '—' : n.toLocaleString() + ' MB'; },
    gb(n) { return (n == null) ? '—' : n.toLocaleString() + ' GB'; },
    // Auto-scale binary bytes (KB/MB/GB/TB). Used by the Hardware
    // section's Junk Files rows so a 4 KB and a 5.2 GB target both
    // read cleanly without picking a unit per-row.
    bytes(n) {
      if (n == null) return '—';
      if (n === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0; let v = n;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return v.toFixed(v < 10 && i > 0 ? 1 : 0) + ' ' + units[i];
    },
    pct(n) { return (n == null) ? '—' : n + '%'; },
    num(n) { return (n == null) ? '—' : n.toLocaleString(); },
    str(s) { return (s == null || s === '') ? '—' : s; },
    bool(v) {
      if (v === true) return 'Enabled';
      if (v === false) return 'Disabled';
      return 'Unknown';
    },
    mbps(n) { return (n == null) ? '—' : n.toLocaleString() + ' Mbps'; },
    time(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        return d.toLocaleString();
      } catch { return iso; }
    },
  };

  function row(label, value, cls) {
    const valClass = cls ? ` rst-section__row-value--${cls}` : '';
    const v = (value === null || value === undefined || value === '') ? '—' : value;
    const muted = (v === '—') ? ' rst-section__row-value--muted' : '';
    return `
      <div class="rst-section__row">
        <div class="rst-section__row-label">${label}</div>
        <div class="rst-section__row-value${valClass}${muted}">${v}</div>
      </div>`;
  }

  function section(opts) {
    const { title, dotClass = '', open = false, rows = [] } = opts;
    return `
      <details class="rst-section"${open ? ' open' : ''}>
        <summary class="rst-section__summary">
          ${dotClass ? `<span class="rst-section__dot rst-section__dot--${dotClass}"></span>` : ''}
          <span class="rst-section__title">${title}</span>
          <span class="rst-section__chevron"></span>
        </summary>
        <div class="rst-section__body">
          ${rows.join('')}
        </div>
      </details>`;
  }

  function render(snap) {
    const host = document.getElementById('sections');
    snap = snap || {};

    // Header meta
    const id = snap.identity || {};
    document.querySelector('[data-field="device"]').textContent = id.deviceName || '—';
    document.querySelector('[data-field="captured"]').textContent = fmt.time(snap.captureTimestamp);

    const cpu     = snap.cpu     || {};
    const ram     = snap.ram     || {};
    const gpu     = snap.gpu     || {};
    const disk    = snap.disk    || {};
    const dsp     = snap.display || {};
    const net     = snap.network || {};
    const os      = snap.os      || {};
    const rv      = snap.revit   || {};
    const mdl     = rv.model     || {};
    const wbs     = rv.warningsBySeverity || {};
    const cleanup = snap.cleanup || null;

    // GPU rows: one per adapter when snap.gpus is present (multi-GPU machines
    // report both integrated + discrete); fall back to the single snap.gpu for
    // older snapshots. Label as "GPU 1/2/…" only when there's more than one.
    const gpuList = (Array.isArray(snap.gpus) && snap.gpus.length) ? snap.gpus
                  : (gpu.name ? [gpu] : []);
    const gpuRows = gpuList.length
      ? gpuList.map((g, i) => row(
          gpuList.length > 1 ? `GPU ${i + 1}` : 'GPU',
          `${g.name}<span class="sub">driver ${fmt.str(g.driverVersion)} · VRAM ${fmt.mb(g.vramTotalMB)}</span>`))
      : [row('GPU', null)];

    // Severity ranking: ok < warn-soft < warn < danger
    const sevRank = { 'ok': 0, 'warn-soft': 1, 'warn': 2, 'danger': 3 };
    const worse = (a, b) => sevRank[a] >= sevRank[b] ? a : b;

    // RAM: <75% ok · 75-85% warn · >=85% danger
    let ramSev = 'ok';
    if (ram.usedPercent != null) {
      if (ram.usedPercent >= 85) ramSev = 'danger';
      else if (ram.usedPercent >= 75) ramSev = 'warn';
    }

    // CPU (single-sample, noisy — generous thresholds):
    //   <60 ok · 60-80 warn-soft · 80-90 warn · >=90 danger
    let cpuSev = 'ok';
    if (cpu.usedPercent != null) {
      if (cpu.usedPercent >= 90) cpuSev = 'danger';
      else if (cpu.usedPercent >= 80) cpuSev = 'warn';
      else if (cpu.usedPercent >= 60) cpuSev = 'warn-soft';
    }

    // Disk free: >100GB ok · 50-100GB warn-soft · 30-50GB warn · <30GB danger
    let diskSev = 'ok';
    if (disk.availableGB != null) {
      if (disk.availableGB < 30) diskSev = 'danger';
      else if (disk.availableGB < 50) diskSev = 'warn';
      else if (disk.availableGB < 100) diskSev = 'warn-soft';
    }

    // Model size: <1GB ok · 1-1.5GB warn-soft · 1.5-2GB warn · >=2GB danger
    let modelSev = 'ok';
    if (mdl.sizeMB != null) {
      if (mdl.sizeMB >= 2048) modelSev = 'danger';
      else if (mdl.sizeMB >= 1536) modelSev = 'warn';
      else if (mdl.sizeMB >= 1024) modelSev = 'warn-soft';
    }

    const hwDot = worse(worse(ramSev, diskSev), cpuSev);

    // Helper: build a .sub with optional severity class (whole sub colored)
    const subCls = (sev) => (sev && sev !== 'ok') ? ` sub--${sev}` : '';

    const accelWarn = (rv.hardwareAcceleration === false);
    const warnLot   = (rv.warningsCount != null && rv.warningsCount >= 500);
    const revitDot  = (accelWarn || warnLot) ? 'warn' : 'info';

    const severityBreakdown = Object.keys(wbs).length
      ? Object.entries(wbs).map(([k, v]) => `${k}: ${v}`).join(' · ')
      : '';

    // Junk Files rows — one per cleanup target, plus a Total row.
    // Surfaced inline in Hardware (RST-032) so users can read reclaimable
    // space alongside the rest of the device stats. Only renders when a
    // scan has populated snap.cleanup; first-load / pre-scan snapshots
    // omit it cleanly (no rows = no clutter).
    const junkRows = [];
    if (cleanup && Array.isArray(cleanup.targets) && cleanup.targets.length > 0) {
      cleanup.targets.forEach(function(t) {
        const isIni = t.kind === 'iniRecentFiles';
        const sizeText = isIni ? '' : fmt.bytes(t.sizeBytes);
        const countText = isIni
          ? `${fmt.num(t.fileCount)} entries`
          : `${fmt.num(t.fileCount)} files`;
        const firstResolved = (t.resolvedPaths && t.resolvedPaths[0]) || t.path || '';
        const more = (t.resolvedPaths && t.resolvedPaths.length > 1)
          ? ` · ${t.resolvedPaths.length} paths`
          : '';
        const value = isIni
          ? `${countText}<span class="sub">${firstResolved}${more}</span>`
          : `${sizeText}<span class="sub">${countText} · ${firstResolved}${more}</span>`;
        junkRows.push(row('  ' + (t.name || '(unnamed)'), value));
      });
      junkRows.push(row('Junk total',
        `<strong>${fmt.bytes(cleanup.totalSizeBytes)}</strong><span class="sub">${fmt.num(cleanup.totalFileCount)} files · reclaimable on Clean Junk Files</span>`));
    }

    const html = [
      section({
        title: 'Hardware',
        dotClass: hwDot,
        rows: [
          row('User', id.windowsUsername),
          row('CPU', cpu.name
            ? `${cpu.name}<span class="sub">${cpu.physicalCores || '?'} cores · ${cpu.logicalCores || '?'} logical${
                cpu.usedPercent != null
                  ? ` · <span class="sub-accent--${cpuSev}">${fmt.pct(cpu.usedPercent)} used</span>`
                  : ''
              }</span>`
            : null),
          row('RAM', (ram.totalMB != null)
            ? `${fmt.mb(ram.totalMB)}<span class="sub${subCls(ramSev)}">${fmt.mb(ram.usedMB)} used · ${fmt.pct(ram.usedPercent)}</span>`
            : null),
          ...gpuRows,
          row('Disk (C:)', (disk.totalGB != null)
            ? `${fmt.str(disk.friendlyName)}<span class="sub${subCls(diskSev)}">${fmt.str(disk.type)} · ${fmt.gb(disk.availableGB)} free of ${fmt.gb(disk.totalGB)} · ${fmt.pct(disk.usedPercent)} used</span>`
            : null),
          ...junkRows,
        ],
      }),

      section({
        title: 'Display & Network',
        dotClass: 'info',
        rows: [
          row('Resolution', dsp.primaryResolution),
          row('Monitors', fmt.num(dsp.monitorCount)),
          row('Adapter', net.adapterName
            ? `${net.adapterName}<span class="sub">${fmt.str(net.type)}</span>`
            : null),
          row('Speed', fmt.mbps(net.speedMbps)),
        ],
      }),

      section({
        title: 'Revit',
        dotClass: revitDot,
        rows: [
          row('Version', rv.version
            ? `${rv.version}<span class="sub">build ${fmt.str(rv.build)}</span>`
            : null),
          row('Username', rv.username),
          row('Hardware Accel',
            fmt.bool(rv.hardwareAcceleration),
            rv.hardwareAcceleration === true ? 'ok' :
            rv.hardwareAcceleration === false ? 'warn' : null),
          row('Model', mdl.name
            ? `${mdl.name}${
                mdl.path ? `<span class="sub">${mdl.path}</span>` : ''
              }${
                mdl.sizeMB != null ? `<span class="sub${subCls(modelSev)}">${mdl.sizeMB.toLocaleString()} MB</span>` : ''
              }`
            : null),
          row('Warnings', (rv.warningsCount != null)
            ? `${fmt.num(rv.warningsCount)}${severityBreakdown ? `<span class="sub">${severityBreakdown}</span>` : ''}`
            : null, warnLot ? 'warn' : null),
        ],
      }),

      section({
        title: 'Operating System',
        rows: [
          row('Name', [os.name, os.release].filter(Boolean).join(' ') || null),
          row('Build', os.build || os.version),
        ],
      }),
    ].join('');

    host.innerHTML = html;
  }

  async function load() {
    try {
      const snap = await window.pywebview.api.get_snapshot();
      render(snap);
    } catch (e) {
      render(null);
    }
  }

  window.addEventListener('pywebviewready', load);

  // ── Scan button ──────────────────────────────────────────────────────────
  const btnScan = document.getElementById('btnScan');
  const scanLabel = btnScan.querySelector('.rst-footer-btn__label');

  function setScanLoading(loading) {
    btnScan.disabled = loading;
    if (loading) {
      scanLabel.textContent = 'Scanning…';
      if (!btnScan.querySelector('.rst-spinner')) {
        const s = document.createElement('span');
        s.className = 'rst-spinner';
        btnScan.insertBefore(s, scanLabel);
      }
    } else {
      scanLabel.textContent = 'Scan System';
      const s = btnScan.querySelector('.rst-spinner');
      if (s) s.remove();
    }
  }

  btnScan.addEventListener('click', async function () {
    setScanLoading(true);
    try {
      const result = await window.pywebview.api.run_scan();
      if (result && result.ok) {
        render(result.data);
      } else {
        RSTmsgInform('Scan failed', (result && result.error) || 'Unknown error');
      }
    } catch (e) {
      RSTmsgInform('Scan failed', String(e));
    } finally {
      setScanLoading(false);
    }
  });

  // ── Footer buttons + Junk cleanup modal ──────────────────────────────────
  const junkOverlay = document.getElementById('junkOverlay');
  const junkRows = document.getElementById('junkRows');

  // Per-target list snapshot kept around for result formatting (so the
  // "X deleted / Y locked" lines can label each row by its display name
  // without round-tripping a second bridge call).
  let cleanupTargets = [];

  document.getElementById('btnClose').addEventListener('click', function () {
    window.pywebview.api.close_window();
  });

  document.getElementById('btnClean').addEventListener('click', async function () {
    try {
      cleanupTargets = (await window.pywebview.api.get_cleanup_targets()) || [];
    } catch (e) {
      cleanupTargets = [];
    }
    renderJunkRows(cleanupTargets);
    junkOverlay.classList.add('visible');
  });

  document.getElementById('junkCancel').addEventListener('click', function () {
    junkOverlay.classList.remove('visible');
  });

  function renderJunkRows(targets) {
    junkRows.innerHTML = '';
    if (!targets || targets.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'rst-junk-row';
      empty.innerHTML = '<div class="rst-junk-row-text"><div class="rst-junk-row-label">No cleanup targets configured</div>' +
                        '<span class="rst-junk-row-hint">Add some in the Builder → Junk Cleanup section.</span></div>';
      junkRows.appendChild(empty);
      return;
    }
    targets.forEach(function (t) {
      const row = document.createElement('div');
      row.className = 'rst-junk-row';
      const text = document.createElement('div');
      text.className = 'rst-junk-row-text';
      const label = document.createElement('div');
      label.className = 'rst-junk-row-label';
      label.textContent = t.name || '(unnamed)';
      const hint = document.createElement('span');
      hint.className = 'rst-junk-row-hint';
      hint.textContent = t.path || '';
      text.appendChild(label);
      text.appendChild(hint);
      const toggle = document.createElement('label');
      toggle.className = 'rst-toggle';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.dataset.targetId = t.id || t.name || '';
      const track = document.createElement('div');
      track.className = 'rst-toggle-track';
      track.innerHTML = '<div class="rst-toggle-thumb"></div>';
      toggle.appendChild(cb);
      toggle.appendChild(track);
      row.appendChild(text);
      row.appendChild(toggle);
      junkRows.appendChild(row);
    });
  }

  document.getElementById('junkRun').addEventListener('click', async function () {
    const selectedIds = [];
    junkRows.querySelectorAll('input[type=checkbox]').forEach(function (el) {
      if (el.checked && el.dataset.targetId) selectedIds.push(el.dataset.targetId);
    });

    junkOverlay.classList.remove('visible');

    if (selectedIds.length === 0) {
      RSTmsgInform('Nothing selected', 'No targets were chosen for cleanup.');
      return;
    }

    const confirmed = await RSTmsgConfirm(
      'Delete selected junk?',
      'This will permanently delete files in the selected targets. Files locked by running applications are skipped.'
    );
    if (!confirmed) return;

    RSTmsgWait('Cleaning', 'Deleting selected junk files');
    try {
      const result = await window.pywebview.api.clean_junk(selectedIds);
      RSTmsgWaitClose();
      const d = (result && result.deleted) || {};
      const s = (result && result.skipped) || {};
      const selectedSet = new Set(selectedIds);
      const lines = cleanupTargets
        .filter(function (t) { return selectedSet.has(t.id || t.name || ''); })
        .map(function (t) {
          const key = t.id || t.name || '';
          const del = (d[key] || 0).toLocaleString();
          const skip = s[key] || 0;
          const label = t.name || key;
          return skip > 0
            ? `${label}: ${del} deleted, ${skip.toLocaleString()} locked/in-use`
            : `${label}: ${del} deleted`;
        });
      RSTmsgInform('Cleanup complete', lines.join('\n'));
    } catch (e) {
      RSTmsgWaitClose();
      RSTmsgInform('Cleanup failed', String(e));
    }
  });

  // ── Activity tab ─────────────────────────────────────────────────────────
  // Charts are inline SVG (the asset is CSP-locked — no CDN libraries):
  // monotone cubic (Fritsch–Carlson) smoothing so the curve never
  // overshoots between points — a fast sync next to a slow one can't
  // render as a negative duration. The chart-math functions below are
  // top-level declarations on purpose: the headless UI tests extract and
  // exercise the shipped code.

  // Fritsch–Carlson tangents: monotone on every segment, flat where the
  // data is flat, so the interpolant stays within each segment's y-range.
  function monotoneTangents(xs, ys) {
    const n = xs.length;
    if (n === 0) return [];
    if (n === 1) return [0];
    const d = [];
    for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
    const m = [d[0]];
    for (let i = 1; i < n - 1; i++) {
      m.push(d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
    }
    m.push(d[n - 2]);
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i];
      const s = a * a + b * b;
      if (s > 9) {
        const t = 3 / Math.sqrt(s);
        m[i] = t * a * d[i];
        m[i + 1] = t * b * d[i];
      }
    }
    return m;
  }

  // Cubic Hermite → cubic Bézier path through pts ([{x,y}], ascending x).
  // Points sharing an x collapse to their mean y first — an equal-x pair
  // zeroes a secant denominator and emits NaN into the path (SC-031); the
  // curve passes through the mean while the caller still dots every raw
  // point. Empty string below 2 distinct x — the caller renders dots only.
  function monotoneCubicPath(pts) {
    const groups = [];
    for (const p of pts) {
      const last = groups[groups.length - 1];
      if (last && p.x === last.x) { last.sum += p.y; last.count++; }
      else groups.push({ x: p.x, sum: p.y, count: 1 });
    }
    const n = groups.length;
    if (n < 2) return '';
    const xs = groups.map(g => g.x), ys = groups.map(g => g.sum / g.count);
    const m = monotoneTangents(xs, ys);
    let path = 'M' + xs[0].toFixed(2) + ' ' + ys[0].toFixed(2);
    for (let i = 0; i < n - 1; i++) {
      const h = xs[i + 1] - xs[i];
      path += 'C' + [
        xs[i] + h / 3, ys[i] + (m[i] * h) / 3,
        xs[i + 1] - h / 3, ys[i + 1] - (m[i + 1] * h) / 3,
        xs[i + 1], ys[i + 1],
      ].map(v => v.toFixed(2)).join(' ');
    }
    return path;
  }

  // Empty/sparse states are first-class: 0 points → quiet empty state,
  // 1 point → dot without a curve, 2+ → dots + smoothed curve.
  function chartMode(points) {
    if (!points || points.length === 0) return 'empty';
    if (points.length < 2) return 'dots';
    return 'curve';
  }

  function fmtDur(seconds) {
    if (seconds == null || !isFinite(seconds)) return '—';
    if (seconds < 90) return (seconds < 10 ? seconds.toFixed(1) : Math.round(seconds)) + 's';
    const mTot = Math.floor(seconds / 60);
    if (mTot < 90) return mTot + 'm ' + String(Math.round(seconds % 60)).padStart(2, '0') + 's';
    return Math.floor(mTot / 60) + 'h ' + String(mTot % 60).padStart(2, '0') + 'm';
  }

  function fmtHoursShort(h) {
    if (h == null || !isFinite(h)) return '—';
    return (Math.round(h * 10) / 10) + 'h';
  }

  function fmtElapsed(ms) {
    if (ms == null || !isFinite(ms) || ms < 0) return '—';
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 3600)).padStart(2, '0') + ':' +
           String(Math.floor((s % 3600) / 60)).padStart(2, '0') + ':' +
           String(s % 60).padStart(2, '0');
  }

  // One shared renderer: axis gridlines, monotone curve, hover dots
  // (native <title> tooltips). Pure string builder — testable headless.
  function buildChartSvg(points, opts) {
    const W = 760, H = 190, padL = 46, padR = 14, padT = 14, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    const yFmt = opts.yFmt, mode = chartMode(points);
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
    const yTop = Math.max(Math.max.apply(null, ys), 0) || 1;
    const yMax = yTop * 1.12;
    const sx = x => (xMax === xMin) ? padL + iw / 2 : padL + ((x - xMin) / (xMax - xMin)) * iw;
    const sy = y => padT + ih - (y / yMax) * ih;

    const parts = ['<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">'];
    for (let g = 0; g <= 3; g++) {
      const gy = padT + (ih * g) / 3;
      const gv = yMax * (1 - g / 3);
      parts.push('<line class="act-grid" x1="' + padL + '" y1="' + gy.toFixed(1) +
                 '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '"/>');
      parts.push('<text class="act-axis-label" x="' + (padL - 6) + '" y="' + (gy + 3).toFixed(1) +
                 '" text-anchor="end">' + yFmt(gv) + '</text>');
    }
    const tickCount = Math.min(points.length, 5);
    for (let t = 0; t < tickCount; t++) {
      const idx = tickCount === 1 ? 0 : Math.round((t * (points.length - 1)) / (tickCount - 1));
      const p = points[idx];
      parts.push('<text class="act-axis-label" x="' + sx(p.x).toFixed(1) + '" y="' + (H - 8) +
                 '" text-anchor="middle">' +
                 new Date(p.x).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
                 '</text>');
    }
    if (mode === 'curve') {
      const path = monotoneCubicPath(points.map(p => ({ x: sx(p.x), y: sy(p.y) })));
      parts.push('<path class="act-line" d="' + path + '"/>');
    }
    points.forEach(p => {
      parts.push('<circle class="act-dot" cx="' + sx(p.x).toFixed(1) + '" cy="' + sy(p.y).toFixed(1) +
                 '" r="3"><title>' + p.label + '</title></circle>');
    });
    parts.push('</svg>');
    return parts.join('');
  }

  function chartEmptyHtml(title, hint) {
    return '<div class="act-empty"><div class="act-empty-title">' + title + '</div>' +
           (hint ? '<div class="act-empty-hint">' + hint + '</div>' : '') + '</div>';
  }

  let activityRangeDays = 7;
  let sessionTicker = null;

  function stopTicker() {
    if (sessionTicker) { clearInterval(sessionTicker); sessionTicker = null; }
  }

  function startTicker(session) {
    stopTicker();
    const startTs = session && session.startTs ? Date.parse(session.startTs) : null;
    const fileTs = session && session.currentFileOpenTs ? Date.parse(session.currentFileOpenTs) : null;
    const timeEl = document.getElementById('actSessionTime');
    const subEl = document.getElementById('actSessionSub');
    function tick() {
      const now = Date.now();
      timeEl.textContent = startTs ? fmtElapsed(now - startTs) : '—';
      subEl.textContent = fileTs ? ('this file open ' + fmtElapsed(now - fileTs)) : '';
    }
    tick();
    if (startTs || fileTs) sessionTicker = setInterval(tick, 1000);
  }

  function renderTelemetryStatus(status) {
    status = status || {};
    document.getElementById('telemetryToggle').checked = (status.enabled === true);
    const bits = [
      status.enabled === true ? 'collection on' : 'collection off',
      fmt.num(status.outboxFileCount) + ' files',
      fmt.bytes(status.outboxSizeBytes),
    ];
    if (status.oldestEventTs) {
      bits.push('since ' + new Date(status.oldestEventTs).toLocaleDateString());
    }
    document.getElementById('telemetryStatusLine').textContent = bits.join(' · ');
  }

  function renderActivity(data) {
    startTicker(data.session);
    renderTelemetryStatus(data.status);

    const sessionBody = document.getElementById('chartSessionBody');
    const openBody = document.getElementById('chartOpenBody');
    const syncBody = document.getElementById('chartSyncBody');
    const file = data.file;

    if (!file) {
      const noModel = chartEmptyHtml('No model open', 'Open a model to see its activity history.');
      sessionBody.innerHTML = noModel;
      openBody.innerHTML = noModel;
      syncBody.innerHTML = noModel;
      return;
    }

    // Session time — one point per calendar day, zeros included. All-zero
    // range = no recorded history, not a flat line at 0.
    const perDay = (file.perDayOpenHours || []).map(p => ({
      x: Date.parse(p.date + 'T00:00:00'),
      y: p.hours,
      label: p.date + ' — ' + fmtHoursShort(p.hours),
    }));
    if (perDay.some(p => p.y > 0)) {
      sessionBody.innerHTML = buildChartSvg(perDay, { yFmt: fmtHoursShort });
    } else {
      sessionBody.innerHTML = chartEmptyHtml('No time recorded in this range',
        file.matchedKeys ? '' : 'This model has no usable identity key yet — save it first.');
    }

    const opens = (file.openEvents || []).map(p => ({
      x: Date.parse(p.ts), y: p.seconds,
      label: new Date(p.ts).toLocaleString() + ' — ' + fmtDur(p.seconds),
    }));
    const openMode = chartMode(opens);
    openBody.innerHTML =
      openMode === 'empty' ? chartEmptyHtml('No opens in this range', '') :
      openMode === 'dots' ? buildChartSvg(opens, { yFmt: fmtDur }) + chartEmptyHtml('', 'not enough history yet') :
      buildChartSvg(opens, { yFmt: fmtDur });

    // Sync history only applies to workshared / cloud models.
    if (file.isWorkshared !== true && file.isCloud !== true) {
      syncBody.innerHTML = chartEmptyHtml('Not a workshared model',
        'Sync history appears for workshared and cloud models.');
    } else {
      const syncs = (file.syncEvents || []).map(p => ({
        x: Date.parse(p.ts), y: p.seconds,
        label: new Date(p.ts).toLocaleString() + ' — ' + fmtDur(p.seconds),
      }));
      const syncMode = chartMode(syncs);
      syncBody.innerHTML =
        syncMode === 'empty' ? chartEmptyHtml('No syncs in this range', '') :
        syncMode === 'dots' ? buildChartSvg(syncs, { yFmt: fmtDur }) + chartEmptyHtml('', 'not enough history yet') :
        buildChartSvg(syncs, { yFmt: fmtDur });
    }
  }

  function renderActivityError(message) {
    stopTicker();
    const err = chartEmptyHtml('Could not load activity', message);
    document.getElementById('chartSessionBody').innerHTML = err;
    document.getElementById('chartOpenBody').innerHTML = err;
    document.getElementById('chartSyncBody').innerHTML = err;
  }

  async function loadActivity() {
    try {
      const data = await window.pywebview.api.get_activity(activityRangeDays);
      if (data && data.ok) renderActivity(data);
      else renderActivityError((data && data.error) || 'Unknown error');
    } catch (e) {
      renderActivityError(String(e));
    }
  }

  // ── Tab switching ────────────────────────────────────────────────────────
  function setTab(name) {
    const activity = (name === 'activity');
    document.getElementById('tabHealth').classList.toggle('active', !activity);
    document.getElementById('tabActivity').classList.toggle('active', activity);
    document.getElementById('sections').hidden = activity;
    document.getElementById('activityPane').hidden = !activity;
    document.getElementById('footerHealth').style.display = activity ? 'none' : 'contents';
    document.getElementById('footerActivity').style.display = activity ? 'contents' : 'none';
    if (activity) loadActivity();
    else stopTicker();
  }

  document.getElementById('tabHealth').addEventListener('click', function () { setTab('health'); });
  document.getElementById('tabActivity').addEventListener('click', function () { setTab('activity'); });

  document.getElementById('actRange').addEventListener('click', function (ev) {
    const btn = ev.target.closest('.act-pill');
    if (!btn) return;
    activityRangeDays = parseInt(btn.dataset.days, 10) || 7;
    this.querySelectorAll('.act-pill').forEach(p => p.classList.toggle('active', p === btn));
    loadActivity();
  });

  document.getElementById('telemetryToggle').addEventListener('change', async function () {
    const want = this.checked;
    try {
      const res = await window.pywebview.api.set_telemetry_enabled(want);
      if (res && res.ok) {
        this.checked = (res.enabled === true);
        loadActivity();
      } else {
        this.checked = (res && typeof res.enabled === 'boolean') ? res.enabled : !want;
        RSTmsgInform('Could not change collection', (res && res.error) || 'Unknown error');
      }
    } catch (e) {
      this.checked = !want;
      RSTmsgInform('Could not change collection', String(e));
    }
  });
</script>
</body>
